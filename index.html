<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AMC Fantasy">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/config.js"></script>
<script src="/game.js"></script>
</head>
<body>
<title>Almazora C Fantasy</title>
<style>
:root{
  --bg:#0b0c10; --top:#1a1b22; --card:#23252e; --card2:#2c2f3a; --line:#343743;
  --fg:#f4f5f7; --muted:#a2a6b3; --accent:#ee5a4b; --yellow:#f5d547; --ok:#3fbf6b; --bad:#ee5a4b;
  --por:#d9a400; --def:#9b3fd6; --cen:#2b8fe0; --del:#f0a020;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Roboto,Arial,sans-serif;font-size:15px;line-height:1.35;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}
input,select{font:inherit}
.app{max-width:640px;margin:0 auto}
header{position:sticky;top:0;z-index:20;background:var(--top);padding-top:env(safe-area-inset-top,0px)}
.hd{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:8px 12px;min-height:60px;max-width:640px;margin:0 auto}
.logo{text-align:center;font-weight:800;font-size:20px;letter-spacing:-.2px}
.logo span{color:var(--accent);font-weight:700}
button.logo{display:block;margin:0 auto;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
button.logo small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.lgrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border-top:1px solid var(--line);width:100%;text-align:left}
.lgrow:first-of-type{border-top:0} .lgrow b{display:block} .lgrow small{color:var(--muted)} .lgrow.on{background:#2b1f22}
.code{font-family:ui-monospace,monospace;font-weight:800;letter-spacing:2px;font-size:20px;color:var(--yellow)}
.rbtn{width:42px;height:42px;border-radius:50%;background:#14151b;border:1px solid var(--line);display:grid;place-items:center}
.rbtn svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round}
.subt{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;max-width:640px;margin:0 auto}
.subt button{padding:12px 4px;color:var(--muted);font-size:16px;border-bottom:3px solid transparent}
.subt button.on{color:var(--fg);border-bottom-color:var(--accent)}
.subline{border-bottom:3px solid var(--accent)}
.info{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 16px 14px}
.info small{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.info b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.info .c{text-align:center}.info .r{text-align:right}
.coin{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--yellow);color:#14151b;font-size:12px;font-weight:800;vertical-align:-3px;flex:none}
.coin.g{background:#5d6170;color:#fff}
main{padding:0 12px 16px}
.reward{border:1px solid var(--line);background:#14151b;padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin:4px 0 14px}
.reward p{grid-column:1/-1;margin:0;font-size:17px}
.reward .amt{display:flex;gap:8px;align-items:center}
.ybtn{background:var(--yellow);color:#14151b;font-weight:700;padding:10px 14px;font-size:15px}
.abtn{background:var(--accent);color:#fff;font-weight:700;padding:9px 16px;font-size:16px}
.abtn.sm{padding:8px 12px;font-size:15px}
.abtn.mine{background:var(--ok)}
.abtn[disabled],.ybtn[disabled],.gbtn[disabled]{opacity:.45;cursor:not-allowed}
.gbtn{background:var(--card2);padding:10px 12px;font-weight:600}
.row2{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
select.form{background:var(--card);color:var(--fg);border:0;padding:10px 12px;font-weight:700;font-size:17px}
.capbtn{background:var(--card);padding:10px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.capbtn.on{background:var(--yellow);color:#14151b}
.crown{width:20px;height:16px;fill:#a46bff}
.capbtn.on .crown{fill:#14151b}
.pitch{position:relative;border:2px solid #2a2c35;padding:14px 6px 18px;display:grid;gap:14px;background:linear-gradient(180deg,#101116,#0c0d11)}
.pitch::before{content:"";position:absolute;left:22%;right:22%;top:-2px;height:15%;border:2px solid #2a2c35;border-top:0}
.pitch::after{content:"";position:absolute;left:50%;bottom:-2px;width:34%;aspect-ratio:2/1;transform:translateX(-50%);border:2px solid #2a2c35;border-bottom:0;border-radius:999px 999px 0 0}
.line{display:flex;justify-content:center;gap:6px;position:relative;z-index:1}
.slot{width:min(19vw,104px);position:relative;background:#1d1f27;display:flex;flex-direction:column;align-items:stretch}
.slot .face{aspect-ratio:1/1;display:grid;place-items:center;background:linear-gradient(180deg,#2d303b,#1e2029);position:relative;overflow:hidden}
.slot .face svg.sil{width:78%;fill:#3c404d}
.slot .nm{background:#f4f5f7;color:#14151b;font-size:13px;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;min-height:22px}
.slot.empty .nm{background:#2a2c35;color:var(--muted);text-align:center}
.slot .badge{position:absolute;right:-5px;bottom:14px;min-width:24px;height:24px;border-radius:12px;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;padding:0 5px;box-shadow:0 0 0 2px var(--bg)}
.slot .badge.neg{background:var(--bad)} .slot .badge.z{background:#5d6170}
.slot .cap{position:absolute;top:2px;right:3px}
.slot .cap svg{width:18px;height:14px;fill:var(--yellow)}
.shirt{width:82%;height:auto}
.shirt text{font-weight:800;font-family:inherit}
.pos{display:inline-block;font-size:12px;font-weight:800;padding:3px 6px;color:#fff;letter-spacing:.02em}
.pos.POR{background:var(--por)} .pos.DEF{background:var(--def)} .pos.CEN{background:var(--cen)} .pos.DEL{background:var(--del)}
.lockmsg{background:#3a2420;color:#ffb3a9;padding:10px 12px;margin-bottom:12px;font-size:14px}
.pcard{display:grid;grid-template-columns:92px minmax(0,1fr);background:var(--card);margin-bottom:12px}
.pcard .ph{background:#181a21;display:grid;place-items:center;position:relative;padding:8px 0}
.pcard .ph .inxi{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.pcard .ph .inxi svg{width:12px;fill:none;stroke:#fff;stroke-width:3}
.pcard .ph .tm{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .bd{padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center}
.pcard .tt{display:flex;gap:8px;align-items:center;min-width:0;text-align:left}
.pcard .tt b{font-size:17px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard .big{text-align:right;color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
.pcard .big b{color:var(--fg);font-size:26px;margin-left:4px}
.pcard .ln{display:flex;gap:8px;align-items:center;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .rt{text-align:right;font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pcard .rt b{color:var(--fg);margin-left:6px}
.ck{width:20px;height:20px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
.ck svg{width:12px;fill:none;stroke:#fff;stroke-width:3}
.ck.no{background:#5d6170}
.ic{width:20px;height:20px;flex:none;stroke:var(--muted);fill:none;stroke-width:2}
.boxes{display:flex;gap:3px}
.boxes i{font-style:normal;width:26px;height:26px;background:#3a3d49;display:grid;place-items:center;font-weight:700;font-size:13px;border-bottom:3px solid #5d6170}
.boxes i.p{border-bottom-color:var(--ok)} .boxes i.z{border-bottom-color:#e0a030} .boxes i.n{border-bottom-color:var(--bad)} .boxes i.x{color:var(--muted)}
.up{color:var(--ok)} .dn{color:var(--bad)}
.trend{font-size:12px;font-weight:700}
.mkbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--accent);color:#14151b}
.mkbar div{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800;gap:10px}
.mkbar b{font-size:19px;font-variant-numeric:tabular-nums}
.mkbar small{display:block;font-size:12px;font-weight:700}
.mkpad{height:60px}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid #1d1f27;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bn .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px 4px}
nav.bn button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:12.5px;color:#d5d8e0;border-radius:28px}
nav.bn button.on{color:var(--accent);background:#23252e}
nav.bn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.act{background:var(--card);padding:14px 16px;margin-bottom:6px}
.act .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.act .h b{font-size:19px}
.act .h span{color:var(--muted);font-size:14px;white-space:nowrap}
.act p{margin:8px 0 0;font-size:16px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.tbl{background:var(--card)}
.tr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.tr:first-child{border-top:0}
.tr .n{font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.tr.me{box-shadow:inset 3px 0 0 var(--accent)}
.tr .t{min-width:0}
.tr .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .t small{color:var(--muted)}
.tr .p{text-align:right;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.tr .p small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips button{background:var(--card);padding:7px 13px;border-radius:16px;font-weight:600;font-size:14px;white-space:nowrap}
.chips button.on{background:var(--accent);color:#fff}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--top);width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 10px;font-size:18px}
.opt{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--card);margin-bottom:6px;text-align:left}
.opt span{color:var(--muted);font-size:14px;white-space:nowrap}
.opt.red{color:#ffb3a9}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--yellow);color:#14151b;font-weight:700;padding:10px 16px;z-index:60;max-width:calc(100% - 32px)}
.box{background:var(--card);padding:14px;margin-bottom:12px}
.box h3{margin:0 0 8px;font-size:18px}
.box p,.box li{color:#d5d8e0}
.box table,.ftab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.box td,.box th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
.box td:last-child,.box th:last-child{text-align:right}
.fld{display:grid;gap:4px;margin-bottom:10px}
.fld label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}
.fld input,.fld select,.inp{background:#14151b;color:var(--fg);border:1px solid var(--line);padding:10px;min-width:0;width:100%}
.note{font-size:13px;color:var(--muted);margin:6px 2px 12px}
.timer{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
/* ficha */
.fhead{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.fhead .av{background:#181a21;display:grid;place-items:center;padding:8px 0}
.fhead h2{margin:4px 0 2px;font-size:22px}
.fhead .sub{color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);margin-bottom:12px}
.kpis div{background:var(--card);padding:10px 8px;text-align:center}
.kpis small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.kpis b{font-size:17px;font-variant-numeric:tabular-nums}
.spark{display:flex;gap:2px;align-items:flex-end;height:46px;background:var(--card);padding:8px;margin-bottom:12px}
.spark i{flex:1;background:#5d6170;display:block;min-height:3px}
.spark i.u{background:var(--ok)} .spark i.d{background:var(--bad)}
.jstrip{position:relative;display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.jbox{flex:0 0 52px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 0 0;text-align:center;overflow:hidden}
.jbox small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.jbox b{display:block;font-size:18px;font-variant-numeric:tabular-nums;padding:2px 0 4px}
.jbox i{display:block;height:4px;background:#5d6170}
.jbox i.p{background:#2fb36b} .jbox i.z{background:#7bc96f} .jbox i.y{background:#e6b93c} .jbox i.n{background:var(--bad)}
.jbox.on{border-color:var(--accent);background:#2b1f22} .jbox.on small{color:var(--accent)}
.jtitle{display:flex;justify-content:space-between;align-items:baseline;padding:8px 2px}
.jtitle b{font-size:17px} .jtitle span{color:var(--muted);font-size:13px}
.stbl{width:100%;border-collapse:collapse;background:var(--card);font-size:14px}
.stbl th{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px;text-align:left}
.stbl th:first-child,.stbl td:first-child{text-align:center;width:72px} .stbl th:last-child,.stbl td:last-child{text-align:right;width:60px}
.stbl td{padding:8px;border-top:1px solid var(--line)} .stbl td:last-child{font-weight:800}
.stbl tr.zero td{color:var(--muted)}
.jtotal{display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:#fff;padding:12px;font-weight:800;margin-top:2px}
.jtotal b{font-size:20px}
.jrow{display:grid;grid-template-columns:34px minmax(0,1fr) 44px 38px;gap:6px;align-items:center;padding:10px 8px;border-top:1px solid var(--line);width:100%;text-align:left;font-size:14px}
.jrow .r{text-align:center;font-weight:700}
.jrow .pt{text-align:right;font-weight:800;font-size:17px}
.jrow small{color:var(--muted);display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jdet{padding:4px 12px 10px 48px;font-size:13px;color:#d5d8e0;background:#1d1f27}
.jdet div{display:flex;justify-content:space-between;padding:2px 0}
.mode{font-size:12px;color:var(--muted);text-align:center;padding:4px 12px 0}
.srch{display:flex;gap:8px;margin-bottom:10px}
</style>

<header>
  <div class="hd">
    <button class="rbtn" data-go="more" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="logo" id="lgname" data-act="leagues">ALMAZORA C <span>fantasy</span></button>
    <button class="rbtn" data-act="search" aria-label="Buscar jugador"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
  </div>
  <div id="subt"></div>
</header>
<div class="app">
  <div id="info"></div>
  <main id="main"><div class="empty">Cargando…</div></main>
</div>
<div id="mkbar"></div>
<div id="sheet"></div>
<div class="toast" id="toast" hidden></div>
<nav class="bn"><div class="in">
  <button data-go="table"><svg viewBox="0 0 32 32"><path d="M5 27V15h7v12M12 27V7h8v20M20 27V12h7v15M3 27h26"/></svg>Clasificación</button>
  <button data-go="team"><svg viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="20"/><path d="M16 6v20M4 11h4v10H4M28 11h-4v10h4"/><circle cx="16" cy="16" r="3"/></svg>Equipo</button>
  <button data-go="market"><svg viewBox="0 0 32 32"><path d="M6 12V7h20v5M6 26h20V12H6zM10 22l5-5 3 3 5-6M20 14h3v3"/></svg>Mercado</button>
  <button data-go="activity"><svg viewBox="0 0 32 32"><rect x="8" y="6" width="16" height="22" rx="2"/><path d="M12 4h8v4h-8zM12 14h8M12 18h8M12 22h8"/></svg>Actividad</button>
  <button data-go="more"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><path d="M13 13a3 3 0 1 1 4 3c-1 .5-1 1-1 2.5M16 22v.5"/></svg>Más</button>
</div></nav>

<script>
/* =====================================================================
   ALMAZORA C FANTASY · Tercera FFCV Grupo 2
   Datos: /liga.json (jugadores y actas J1–J8) + /api/fantasy (cuentas, dinero, pujas, jornadas).
   Reglas y puntos: /game.js (las mismas en el servidor).
   ===================================================================== */
const S = { view: "team", sub: { team: "line", market: "mk", table: "gen", more: "rules" }, st: null, liga: null, store: "loading",
  capMode: false, sheet: null, mpos: "ALL", skew: 0, open: {}, fj: {} };
const CFG = window.FANTASY_CONFIG || { api: "/api/fantasy" };
const TK = "almac-fantasy2-token";
const tok = () => { try { return localStorage.getItem(TK) || ""; } catch (e) { return ""; } };
const LGK = "almac-fantasy2-liga";
let LG = (() => { try { return localStorage.getItem(LGK) || ""; } catch (e) { return ""; } })();
function setLg(c) { LG = c || ""; try { localStorage.setItem(LGK, LG); } catch (e) {} }

/* ---------- utilidades ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = n => Math.round(n || 0).toLocaleString("es-ES");
const fmtD = t => new Date(t).toLocaleDateString("es-ES", { timeZone: "Europe/Madrid", day: "2-digit", month: "2-digit", year: "numeric" });
const fmtKick = ts => { if (!ts) return "Por fijar"; const d = new Date(ts);
  const w = d.toLocaleDateString("es-ES", { weekday: "short", timeZone: "Europe/Madrid" }).replace(".", ""), hm = d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid" });
  return w[0].toUpperCase() + w.slice(1, 3) + " " + d.toLocaleDateString("es-ES", { day: "numeric", timeZone: "Europe/Madrid" }) + "  " + hm.replace(":", ".") + "h"; };
const now = () => Date.now() + S.skew;
const hms = ms => { ms = Math.max(0, ms); const h = Math.floor(ms / 3600e3), m = Math.floor(ms / 60e3) % 60, s = Math.floor(ms / 1e3) % 60; return [h, m, s].map(x => String(x).padStart(2, "0")).join(":"); };
const SIL = '<svg class="sil" viewBox="0 0 100 100"><circle cx="50" cy="36" r="20"/><path d="M12 100c2-24 18-36 38-36s36 12 38 36z"/></svg>';
const CHK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CROWN = '<svg class="crown" viewBox="0 0 24 18"><path d="M2 4l5 5 5-8 5 8 5-5-2 12H4z"/></svg>';
const CLOCK = '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const LOCK = '<svg class="ic" viewBox="0 0 24 24" style="stroke:var(--ok)"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0"/></svg>';
const POSN = { POR: "Portero", DEF: "Defensa", CEN: "Centrocampista", DEL: "Delantero" };

/* ---------- jugadores, equipos y jornadas ---------- */
let PMAP = {};
const PL = id => PMAP[id];
const posOf = id => (S.st && S.st.pos && S.st.pos[id]) || (PMAP[id] || {}).pos || "CEN";
const team = t => (S.liga.teams[t] || { short: "?" });
const hue = t => (t * 47 + 8) % 360;
const MY_T = 0;   // Almazora C
function shirt(p, size) {
  const t = p ? p.t : -1, c = t === MY_T ? "#111" : t >= 0 ? `hsl(${hue(t)} 55% 45%)` : "#3c404d", c2 = t === MY_T ? "#fff" : t >= 0 ? `hsl(${hue(t)} 60% 30%)` : "#2a2c35";
  const stripes = t === MY_T ? '<path d="M38 20h6v70h-6zM50 18h6v72h-6zM62 20h6v70h-6z" fill="#fff" opacity=".9"/>' : "";
  return `<svg class="shirt" viewBox="0 0 100 100" style="width:${size || 82}%"><path d="M30 10l-22 14 9 18 9-5v55h48V37l9 5 9-18-22-14c-3 7-10 11-20 11s-17-4-20-11z" fill="${c}"/>${stripes}<path d="M30 10c3 7 10 11 20 11s17-4 20-11" fill="none" stroke="${c2}" stroke-width="4"/>
    <text x="50" y="72" text-anchor="middle" font-size="30" fill="${t === MY_T ? "#ee5a4b" : "#fff"}" stroke="${t === MY_T ? "#111" : "none"}" stroke-width="1">${p ? esc(p.d || "") : ""}</text></svg>`;
}
function allJ() { const o = {}; Object.values(S.liga.jornadas).forEach(J => o[J.n] = J); Object.values((S.st && S.st.jornadas) || {}).forEach(J => o[J.n] = J); return Object.values(o).sort((a, b) => a.n - b.n); }
const fantasyJ = () => allJ().filter(J => J.n >= GAME.FIRST_J && J.publicada);
const ptsOf = (id, J) => GAME.points(posOf(id), J, id);
function seasonOf(id) { let pf = 0, apps = 0; allJ().forEach(J => { pf += ptsOf(id, J); if (GAME.mins(J, id) > 0) apps++; }); return { pf, apps, media: apps ? pf / apps : 0 }; }
const val = id => (S.st.prices.v[id] || 0);
const ownerOf = id => S.st.owner[id] || null;
const teamName = u => ((S.st.teams[u] || {}).name) || u;
const mySquad = () => S.st.team.squad.filter(PL);
const cur = () => S.st.current;
const locked = () => S.st.current.locked;
const myLineup = () => GAME.lineupFor(S.st.team, cur().n);

/* ---------- servidor ---------- */
async function api(action, body) {
  const r = await fetch(CFG.api, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + tok() }, body: JSON.stringify({ action, lg: LG, ...(body || {}) }) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.error || "Error de conexión"); err.status = r.status; throw err; }
  return j;
}
let busy = false;
async function refresh() {
  if (busy) return; busy = true;
  try { const st = await api("state"); S.skew = st.now - Date.now(); S.st = st; S.store = "ok"; if (st.lg !== LG) setLg(st.lg); render(); }
  catch (e) { if (e.status === 401) { S.store = "auth"; render(); } }
  busy = false;
}
async function act(action, body, okMsg) {
  try { await api(action, body); if (okMsg) toast(okMsg); await refresh(); return true; }
  catch (e) { toast(e.message); return false; }
}
async function boot() {
  try { const r = await fetch("/liga.json"); S.liga = await r.json(); S.liga.players.forEach(p => PMAP[p.id] = p); }
  catch (e) { document.getElementById("main").innerHTML = '<div class="empty">No se han podido cargar los datos de la liga.</div>'; return; }
  if (!tok()) { S.store = "auth"; return render(); }
  await refresh();
  setInterval(() => { if (!document.hidden && !S.sheet && !document.querySelector("input:focus")) refresh(); }, 15000);
  setInterval(tickTimers, 1000);
}
async function auth(mode) {
  const u = (document.getElementById("au-user").value || "").trim(), pw = document.getElementById("au-pass").value || "";
  if (u.length < 2 || pw.length < 6) { S.authMsg = "El usuario necesita 2 letras o más y la contraseña 6 caracteres o más."; return render(); }
  S.authMsg = mode === "up" ? "Creando cuenta…" : "Entrando…"; render();
  try { const { token } = await api(mode === "up" ? "register" : "login", { username: u, password: pw });
    try { localStorage.setItem(TK, token); } catch (e) {}
    S.authMsg = ""; await refresh(); setInterval(() => { if (!document.hidden && !S.sheet && !document.querySelector("input:focus")) refresh(); }, 15000); setInterval(tickTimers, 1000);
  } catch (e) { S.authMsg = e.message; render(); }
}
function authView() {
  return `<div class="box" style="max-width:420px;margin:24px auto;text-align:center"><div class="logo" style="font-size:28px;margin-bottom:8px">ALMAZORA C <span>fantasy</span></div>
    <p>El fantasy de la Tercera FFCV Grupo 2. Empiezas con ${eur(GAME.START_MONEY)} € y una plantilla de unos ${eur(GAME.START_VALUE)} €.</p>
    <div class="subt" style="margin:10px 0"><button data-auth-tab="in" class="${S.authTab !== "up" ? "on" : ""}">Entrar</button><button data-auth-tab="up" class="${S.authTab === "up" ? "on" : ""}">Crear cuenta</button></div>
    <form id="auform" style="display:grid;gap:8px;text-align:left"><div class="fld"><label for="au-user">Usuario</label><input id="au-user" autocomplete="username" autocapitalize="off" placeholder="p. ej. moliner9"></div>
      <div class="fld"><label for="au-pass">Contraseña</label><input id="au-pass" type="password" autocomplete="${S.authTab === "up" ? "new-password" : "current-password"}" placeholder="Mínimo 6 caracteres"></div>
      <button class="abtn" type="submit">${S.authTab === "up" ? "Crear cuenta" : "Entrar"}</button></form>
    <p class="note">${esc(S.authMsg || "")}</p></div>`;
}

/* =====================================================================
   VISTAS
   ===================================================================== */
const SUBS = { team: [["line", "Alineación"], ["squad", "Plantilla"], ["pts", "Puntos"]], market: [["mk", "Mercado"], ["ops", "Mis operaciones"], ["hist", "Histórico"]],
  table: [["gen", "General"], ["jor", "Por jornada"]], more: [["rules", "Reglas"], ["leagues", "Ligas"], ["admin", "Admin"]] };
function render() {
  document.querySelectorAll("nav.bn button").forEach(b => b.classList.toggle("on", b.dataset.go === S.view));
  const main = document.getElementById("main"), info = document.getElementById("info"), bar = document.getElementById("mkbar"), subt = document.getElementById("subt");
  info.innerHTML = ""; bar.innerHTML = "";
  if (S.store === "auth") { subt.innerHTML = ""; main.innerHTML = authView(); return renderSheet(); }
  if (S.store !== "ok") { main.innerHTML = '<div class="empty">Cargando…</div>'; return; }
  const cl = (S.st.leagues || []).find(l => l.code === S.st.lg), ln = document.getElementById("lgname");
  if (ln) ln.innerHTML = cl ? `${esc(cl.name)}<small>Cambiar de liga ▾</small>` : 'ALMAZORA C <span>fantasy</span>';
  if (!S.st.lg) {   // sin liga todavía
    subt.innerHTML = ""; main.innerHTML = S.view === "more" && S.sub.more === "admin" ? adminView() : leaguesView(true); return renderSheet(); }
  const subs = SUBS[S.view] || [];
  subt.innerHTML = S.view === "activity" ? '<div class="subline"></div>' : `<div class="subt">${subs.map(([k, l]) => `<button data-sub="${k}" class="${S.sub[S.view] === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
  if (S.view === "team" || S.view === "market") info.innerHTML = infoBar();
  const v = S.view, sub = S.sub[v];
  main.innerHTML = (v === "team" && !S.st.team.name ? welcome() : "") +
    (v === "team" ? (sub === "line" ? lineView() : sub === "squad" ? squadView() : ptsView()) :
     v === "market" ? (sub === "mk" ? marketView() : sub === "ops" ? opsView() : histView()) :
     v === "table" ? tableView() : v === "activity" ? activityView() : sub === "admin" ? adminView() : sub === "leagues" ? leaguesView() : rulesView());
  if (v === "market") { const bids = Object.values(S.st.myBids || {}).reduce((a, x) => a + x, 0);
    bar.innerHTML = `<div class="mkbar"><div><span><small>Pujas activas</small>${eur(bids)} €</span><b>${eur(S.st.team.money)} <span class="coin">€</span></b></div></div><div class="mkpad"></div>`; }
  renderSheet();
}
function tickTimers() { document.querySelectorAll("[data-ends]").forEach(el => el.textContent = hms(+el.dataset.ends - now())); }
function infoBar() {
  const c = cur(), sq = mySquad(), tv = sq.reduce((s, id) => s + val(id), 0);
  return `<div class="info"><div><small>Fichas</small><b>${sq.length}/${GAME.MAX_SQUAD}</b></div>
    <div class="c"><small>Inicio jornada ${c.n}</small><b>${esc(fmtKick(c.lock))}</b></div>
    <div class="r"><small>Valor equipo</small><b><span class="coin g">€</span> ${eur(tv)}</b></div></div>`;
}
function rewardBox() {
  if (S.st.team.daily === GAME.day(now())) return "";
  return `<div class="reward"><p>¡Tienes tu recompensa diaria disponible!</p><div class="amt"><span class="coin">€</span> +${eur(GAME.DAILY)}</div><button class="ybtn" data-act="daily">Recoger recompensa</button></div>`;
}
function welcome() {
  return `<div class="box"><h3>Ponle nombre a tu equipo</h3><p>Ya tienes ${mySquad().length} jugadores y ${eur(S.st.team.money)} € para pujar en el Mercado.</p>
    <div class="row2"><input id="tname" class="inp" maxlength="28" placeholder="p. ej. Los del 10" style="flex:1"><button class="abtn" data-act="tname">Guardar</button></div></div>`;
}

/* ---- Alineación ---- */
function lineView() {
  const c = cur(), l = myLineup(), lk = locked(), rows = GAME.FORMS[l.f], sq = new Set(mySquad());
  const lastJ = allJ().filter(J => J.matches && J.matches.length).slice(-1)[0];
  let i = 1; const lines = [[["POR", 0]]].concat([["DEF", rows[0]], ["CEN", rows[1]], ["DEL", rows[2]]].map(([pos, n]) => { const a = []; for (let k = 0; k < n; k++) a.push([pos, i++]); return a; }));
  const slot = ([pos, idx]) => {
    const id = l.s[idx], p = id && sq.has(id) ? PL(id) : null;
    if (!p) return `<button class="slot empty" data-slot="${idx}" data-pos="${pos}" ${lk ? "disabled" : ""}><div class="face">${SIL}</div><div class="nm">${pos}</div></button>`;
    const pp = lastJ ? ptsOf(id, lastJ) : null, played = lastJ && lastJ.st[id];
    return `<button class="slot full" data-slot="${idx}" data-pos="${pos}"><div class="face">${shirt(p)}${l.c === id ? `<span class="cap">${CROWN}</span>` : ""}</div><div class="nm">${esc(p.n)}</div>${lastJ ? `<span class="badge ${!played ? "z" : pp < 0 ? "neg" : ""}" title="Puntos en la J${lastJ.n}">${played ? pp : "–"}</span>` : ""}</button>`;
  };
  const opts = Object.keys(GAME.FORMS).map(f => `<option value="${f}" ${f === l.f ? "selected" : ""}>${f.replace(/-/g, "·")}</option>`).join("");
  const filled = l.s.filter(x => x && sq.has(x)).length;
  return rewardBox() +
    (lk ? `<div class="lockmsg">La jornada ${c.n} ya ha empezado. La alineación está cerrada hasta que se publiquen los puntos.</div>` : "") +
    `<div class="row2"><select class="form" id="form" ${lk ? "disabled" : ""} aria-label="Formación">${opts}</select>
      <button class="capbtn ${S.capMode ? "on" : ""}" data-act="cap" ${lk ? "disabled" : ""}>${CROWN} ${S.capMode ? "Toca un jugador" : "Asignar capitán"}</button></div>
    <div class="note">${filled}/11 alineados${filled < 11 ? " · Con menos de 11 no puntúas." : ""} · Los números son los puntos de la J${lastJ ? lastJ.n : "-"}. Toca un jugador para cambiarlo o ver su ficha.</div>
    <div class="pitch">${lines.map(L => `<div class="line">${L.map(slot).join("")}</div>`).join("")}</div>`;
}

/* ---- tarjeta de jugador (plantilla y mercado) ---- */
function pcard(id, mode, item) {
  const p = PL(id), se = seasonOf(id), js = allJ().slice(-5), v = val(id), prev = S.st.prices.prev[id] || v;
  const boxes = js.map(J => { const m = GAME.mins(J, id), pt = ptsOf(id, J); return `<i class="${!(m > 0) ? "x" : pt > 4 ? "p" : pt > 0 ? "z" : "n"}">${m > 0 ? pt : "–"}</i>`; }).join("");
  const inL = mode === "squad" && myLineup().s.includes(id), d = v - prev;
  const trend = d ? `<span class="trend ${d > 0 ? "up" : "dn"}">${d > 0 ? "▲ +" : "▼ "}${eur(d)}</span>` : `<span class="trend" style="color:var(--muted)">=</span>`;
  let mid, btn;
  if (mode === "market") {
    const my = S.st.myBids[id], mine = item.seller === S.st.me;
    mid = `<div class="ln">${CLOCK}<span data-ends="${item.ends}">${hms(item.ends - now())}</span></div><div class="rt">Precio<b>${eur(item.price)}</b></div>
      <div class="ln"><span class="ck">${CHK}</span>${item.seller === "LIGA" ? "LIGA" : esc(teamName(item.seller))}</div><div class="rt">Valor<b>${eur(v)}</b></div>`;
    btn = mine ? `<button class="abtn sm mine" data-unlist="${id}">Retirar</button>` : `<button class="abtn sm ${my ? "mine" : ""}" data-bid="${id}">${my ? "Puja: " + eur(my) : "Pujar"}</button>`;
  } else {
    const listed = S.st.market.some(i => i.pid === id && i.seller === S.st.me);
    mid = `<div class="ln"><span class="ck">${CHK}</span>${listed ? "En el mercado" : "Alineable"}</div><div class="rt">MEDIA: <b>${se.media.toFixed(2).replace(".", ",")}</b></div>
      <div class="ln"><span class="coin">€</span>${eur(v)}</div><div class="rt">${trend}</div>`;
    btn = `<button class="abtn sm" data-acts="${id}">Acciones</button>`;
  }
  return `<div class="pcard"><button class="ph" data-ficha="${id}" aria-label="Ver ficha de ${esc(p.n)}">${shirt(p, 70)}${inL ? `<span class="inxi">${CHK}</span>` : ""}<span class="tm">${esc(team(p.t).short)}</span></button><div class="bd">
    <button class="tt" data-ficha="${id}"><span class="pos ${posOf(id)}">${posOf(id)}</span><b>${esc(p.n)}</b></button><div class="big">PFSY<b>${se.pf}</b></div>
    ${mid}<div class="boxes">${boxes}</div><div>${btn}</div></div></div>`;
}
function squadView() {
  const ord = "PORDEFCENDEL", sq = mySquad().sort((a, b) => ord.indexOf(posOf(a)) - ord.indexOf(posOf(b)) || val(b) - val(a));
  return rewardBox() + (sq.length ? sq.map(id => pcard(id, "squad")).join("") : `<div class="empty">No tienes jugadores. Puja en el Mercado.</div>`) +
    `<div class="note">PFSY: puntos de la temporada según las actas. Toca un jugador para ver de dónde salen.</div>`;
}

/* ---- Puntos ---- */
function ptsView() {
  const pl = fantasyJ().slice().reverse(); if (!pl.length) return `<div class="empty">El fantasy empieza a puntuar en la jornada ${GAME.FIRST_J}. Aquí verás tus puntos de cada jornada, jugador a jugador.</div>`;
  return pl.map(J => { const r = GAME.teamPoints(S.st.team, J, posOf);
    const rows = r.l.s.filter(Boolean).map(id => { const p = PL(id); if (!p) return ""; const v = ptsOf(id, J) * (id === r.l.c ? 2 : 1);
      return `<tr><td><button data-ficha="${id}"><span class="pos ${posOf(id)}">${posOf(id)}</span> ${esc(p.n)}${id === r.l.c ? " (C ×2)" : ""}</button></td><td>${v}</td></tr>`; }).join("");
    return `<div class="box"><h3>Jornada ${J.n}</h3>${r.total == null ? `<p>No has puntuado: alineación incompleta.</p>` : `<p>Total: <b>${r.total} puntos</b> · Premio: ${eur(Math.max(0, r.total) * GAME.PER_POINT)} €</p><table>${rows}</table>`}</div>`; }).join("");
}

/* ---- Mercado ---- */
function marketView() {
  const pos = S.mpos, items = S.st.market.filter(i => PL(i.pid) && (pos === "ALL" || posOf(i.pid) === pos)).sort((a, b) => (a.seller === "LIGA") - (b.seller === "LIGA") || val(b.pid) - val(a.pid));
  return rewardBox() + `<div class="chips">${[["ALL", "Todos"], ["POR", "Porteros"], ["DEF", "Defensas"], ["CEN", "Medios"], ["DEL", "Delanteros"]].map(([k, l]) => `<button data-mpos="${k}" class="${pos === k ? "on" : ""}">${l}</button>`).join("")}</div>` +
    `<div class="note">Pujas a ciegas: nadie ve lo que pujan los demás. A las 00:00 gana la puja más alta y sale mercado nuevo.</div>` +
    (items.length ? items.map(i => pcard(i.pid, "market", i)).join("") : '<div class="empty">No hay jugadores en el mercado.</div>');
}
function opsView() {
  const bids = Object.entries(S.st.myBids || {}), lists = S.st.market.filter(i => i.seller === S.st.me);
  const mine = new RegExp("^(" + [S.st.me, S.st.team.name].filter(Boolean).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ") ha");
  const hist = S.st.log.filter(x => x.type === "market" && mine.test(x.text));
  return `<div class="box"><h3>Mis pujas</h3>${bids.length ? `<table>${bids.map(([id, a]) => `<tr><td><button data-ficha="${id}">${esc(PL(id).n)}</button></td><td><button class="gbtn" data-bid="${id}">${eur(a)} €</button></td></tr>`).join("")}</table>` : "<p>No tienes pujas activas.</p>"}</div>
    <div class="box"><h3>En venta</h3>${lists.length ? `<table>${lists.map(i => `<tr><td>${esc(PL(i.pid).n)}</td><td>desde ${eur(i.price)} €</td></tr>`).join("")}</table>` : "<p>No tienes jugadores en el mercado.</p>"}</div>
    ${hist.map(x => `<div class="act"><div class="h"><b>Operación</b><span>${fmtD(x.at)}</span></div><p>${esc(x.text)}</p></div>`).join("")}`;
}
function histView() {
  const h = S.st.log.filter(x => x.type === "market");
  return h.length ? h.map(x => `<div class="act"><div class="h"><b>Operación de mercado</b><span>${fmtD(x.at)}</span></div><p>${esc(x.text)}</p></div>`).join("") : '<div class="empty">Aún no hay operaciones.</div>';
}

/* ---- Clasificación ---- */
function tableView() {
  const pl = fantasyJ(), sub = S.sub.table, jn = S.tj || (pl.length ? pl[pl.length - 1].n : null), P = S.st.points || {};
  const rows = Object.entries(S.st.teams).map(([u, t]) => { let total = 0; pl.forEach(J => total += (P[J.n] || {})[u] || 0);
    return { u, t, total: sub === "gen" ? total : ((P[jn] || {})[u] ?? null), value: (t.squad || []).reduce((s, id) => s + val(id), 0) }; })
    .sort((a, b) => (b.total ?? -999) - (a.total ?? -999) || b.value - a.value);
  const chips = sub === "jor" ? (pl.length ? `<div class="chips">${pl.map(J => `<button data-tj="${J.n}" class="${J.n === jn ? "on" : ""}">J${J.n}</button>`).join("")}</div>` : '<div class="empty">Aún no hay jornadas puntuadas.</div>') : "";
  if (sub === "jor" && !pl.length) return chips;
  return chips + `<div class="tbl">${rows.map((r, i) => `<button class="tr ${r.u === S.st.me ? "me" : ""}" data-rival="${esc(r.u)}"><div class="n">${i + 1}</div><div class="t"><b>${esc(r.t.name || r.u)}</b><small>${esc(r.u)} · ${eur(r.value)} €</small></div>
    <div class="p">${r.total == null ? "–" : r.total}<small>puntos</small></div></button>`).join("")}</div>`;
}

/* ---- Actividad ---- */
const LOGT = { market: "Operación de mercado", reward: "Recompensa", nopts: "No puntuación", jornada: "Jornada", join: "Nuevo equipo" };
function activityView() {
  return S.st.log.length ? S.st.log.map(x => `<div class="act"><div class="h"><b>${esc(LOGT[x.type] || "Aviso")}</b><span>${fmtD(x.at)}</span></div><p>${esc(x.text)}</p></div>`).join("") : '<div class="empty">Sin actividad todavía.</div>';
}

/* ---- Ligas privadas (como en AlmaBet): crear, unirse con código y cambiar ---- */
function leaguesView(first) {
  const L = S.st.leagues || [], cl = L.find(l => l.code === S.st.lg);
  return (first ? `<div class="box"><h3>Entra en una liga</h3><p>Crea tu liga y pasa el código a tus amigos, o únete a la de alguien con su código. En cada liga empiezas con ${eur(GAME.START_MONEY)} € y una plantilla de unos ${eur(GAME.START_VALUE)} €.</p></div>` : "") +
    (cl ? `<div class="box"><h3>${esc(cl.name)}</h3><p>Código para invitar a tus amigos:</p><div class="row2" style="align-items:center"><span class="code">${esc(cl.code)}</span><button class="gbtn" data-share="${esc(cl.code)}">Compartir</button></div>
      <p class="note">Cada liga tiene sus propias plantillas, mercado y clasificación. Los puntos y los precios de los jugadores son los mismos en todas.</p></div>` : "") +
    (L.length > 1 ? `<div class="box"><h3>Mis ligas</h3>${L.map(l => `<button class="lgrow ${l.code === S.st.lg ? "on" : ""}" data-lg="${esc(l.code)}"><span><b>${esc(l.name)}</b><small>${esc(l.code)}${l.admin === S.st.me ? " · la creaste tú" : ""}</small></span><span>${l.code === S.st.lg ? "Estás aquí" : "Entrar ›"}</span></button>`).join("")}</div>` : "") +
    `<div class="box"><h3>Unirse a una liga</h3><div class="row2"><input id="lgcode" class="inp" maxlength="8" placeholder="Código, p. ej. K7M2QX" autocapitalize="characters" style="flex:1;text-transform:uppercase"><button class="abtn" data-act="joinlg">Unirme</button></div></div>

// Mismo cálculo que datos/extraer_liga.js (GAME.parseActa): minutos, goles, gol decisivo, encajados en el campo, tarjetas…
function parseActas(files) {
  const byName = {}; S.liga.teams.forEach((t, i) => byName[t.name.toLowerCase()] = i);
  const tid = n => byName[String(n).toLowerCase()];
  const out = { n: null, matches: [], st: {}, unknown: 0 };
  for (const d of files) {
    if (!d || !d.resultado || !d.alineaciones) throw new Error("Algún archivo no es un acta.");
    if (out.n != null && d.jornada !== out.n) throw new Error("Hay actas de jornadas distintas.");
    const r = GAME.parseActa(d, tid); out.n = r.n; out.matches.push(r.match);
    Object.entries(r.st).forEach(([pid, x]) => { if (PL(pid)) out.st[pid] = x; else out.unknown++; });
  }
  return out;
}

    try { const files = await Promise.all([...e.target.files].map(f => f.text().then(JSON.parse))); S.imp = parseActas(files);
      if (S.imp.n < GAME.FIRST_J) S.imp.err = "Esa jornada (" + S.imp.n + ") es anterior a la J" + GAME.FIRST_J + "."; }
    catch (err) { S.imp = { err: err.message || "No se han podido leer los archivos." }; }
    render();
  }
});
boot();
</script>
