<title>Almazora C Fantasy</title>
<style>
:root{
  --bg:#0b0c10; --top:#1a1b22; --card:#23252e; --card2:#2c2f3a; --line:#343743;
  --fg:#f4f5f7; --muted:#a2a6b3; --accent:#ee5a4b; --yellow:#f5d547; --ok:#3fbf6b; --bad:#ee5a4b;
  --por:#d9a400; --def:#9b3fd6; --cen:#2b8fe0; --del:#f0a020;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
/* iPhone (app en pantalla de inicio con barra translúcida): sin esto, en pantallas con poco contenido la barra de abajo queda flotando con un hueco debajo */
html{min-height:calc(100% + env(safe-area-inset-top,0px))}
body{min-height:100vh;min-height:100dvh}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Roboto,Arial,sans-serif;font-size:15px;line-height:1.35;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}
input,select{font:inherit}
.app{max-width:640px;margin:0 auto}
header{position:sticky;top:0;z-index:20;background:var(--top);padding-top:env(safe-area-inset-top,0px)}
.hd{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:8px 12px;min-height:60px;max-width:640px;margin:0 auto}
.logo{text-align:center;font-weight:800;font-size:20px;letter-spacing:-.2px}
.logo span{color:var(--accent);font-weight:700}
button.logo{display:block;margin:0 auto;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
button.logo small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.lgrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border-top:1px solid var(--line);width:100%;text-align:left}
.lgrow:first-of-type{border-top:0} .lgrow b{display:block} .lgrow small{color:var(--muted)} .lgrow.on{background:#2b1f22}
.code{font-family:ui-monospace,monospace;font-weight:800;letter-spacing:2px;font-size:20px;color:var(--yellow)}
.rbtn{width:42px;height:42px;border-radius:50%;background:#14151b;border:1px solid var(--line);display:grid;place-items:center}
.rbtn svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round}
.subt{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;max-width:640px;margin:0 auto}
.subt button{padding:12px 4px;color:var(--muted);font-size:16px;white-space:nowrap;border-bottom:3px solid transparent}
.subt button.on{color:var(--fg);border-bottom-color:var(--accent)}
.subline{border-bottom:3px solid var(--accent)}
.info{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 16px 14px}
.info small{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.info b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.info .c{text-align:center}.info .r{text-align:right}
.coin{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--yellow);color:#14151b;font-size:12px;font-weight:800;vertical-align:-3px;flex:none}
.coin.g{background:#5d6170;color:#fff}
main{padding:0 12px 16px}
.reward{border:1px solid var(--line);background:#14151b;padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin:4px 0 14px}
.reward p{grid-column:1/-1;margin:0;font-size:17px}
.reward .amt{display:flex;gap:8px;align-items:center}
.ybtn{background:var(--yellow);color:#14151b;font-weight:700;padding:10px 14px;font-size:15px}
.abtn{background:var(--accent);color:#fff;font-weight:700;padding:9px 16px;font-size:16px}
.abtn.sm{padding:8px 12px;font-size:15px}
.abtn.mine{background:var(--ok)}
.abtn[disabled],.ybtn[disabled],.gbtn[disabled]{opacity:.45;cursor:not-allowed}
.gbtn{background:var(--card2);padding:10px 12px;font-weight:600}
.row2{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
select.form{background:var(--card);color:var(--fg);border:0;padding:10px 12px;font-weight:700;font-size:17px}
.capbtn{background:var(--card);padding:10px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.capbtn.on{background:var(--yellow);color:#14151b}
.crown{width:20px;height:16px;fill:#a46bff}
.capbtn.on .crown{fill:#14151b}
.pitch{position:relative;border:2px solid #2a2c35;padding:14px 6px 18px;display:grid;gap:14px;background:linear-gradient(180deg,#101116,#0c0d11)}
.pitch::before{content:"";position:absolute;left:22%;right:22%;top:-2px;height:15%;border:2px solid #2a2c35;border-top:0}
.pitch::after{content:"";position:absolute;left:50%;bottom:-2px;width:34%;aspect-ratio:2/1;transform:translateX(-50%);border:2px solid #2a2c35;border-bottom:0;border-radius:999px 999px 0 0}
.line{display:flex;justify-content:center;gap:6px;position:relative;z-index:1}
.slot{width:min(19vw,104px);position:relative;background:#1d1f27;display:flex;flex-direction:column;align-items:stretch}
.slot .face{aspect-ratio:1/1;display:grid;place-items:center;background:linear-gradient(180deg,#2d303b,#1e2029);position:relative;overflow:hidden}
.slot .face svg.sil{width:78%;fill:#3c404d}
.slot .nm{background:#f4f5f7;color:#14151b;font-size:13px;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;min-height:22px}
.slot.empty .nm{background:#2a2c35;color:var(--muted);text-align:center}
.slot .badge{position:absolute;right:-5px;bottom:14px;min-width:24px;height:24px;border-radius:12px;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;padding:0 5px;box-shadow:0 0 0 2px var(--bg)}
.slot .badge.neg{background:var(--bad)} .slot .badge.z{background:#5d6170}
.slot .cap{position:absolute;top:2px;right:3px}
.slot .cap svg{width:18px;height:14px;fill:var(--yellow)}
.shirt{width:82%;height:auto}
.shirt.foto{position:absolute;inset:0;width:100%!important;height:100%;object-fit:cover;object-position:center top;background:#181a21}
.pcard .ph:has(.foto) .tm{background:rgba(0,0,0,.6);color:#fff;bottom:0;padding:3px 4px}
.slot .face .cap{z-index:2}
.shirt text{font-weight:800;font-family:inherit}
.pos{display:inline-block;font-size:12px;font-weight:800;padding:3px 6px;color:#fff;letter-spacing:.02em}
.pos.POR{background:var(--por)} .pos.DEF{background:var(--def)} .pos.CEN{background:var(--cen)} .pos.DEL{background:var(--del)}
.lockmsg{background:#3a2420;color:#ffb3a9;padding:10px 12px;margin-bottom:12px;font-size:14px}
.pcard{display:grid;grid-template-columns:92px minmax(0,1fr);background:var(--card);margin-bottom:12px}
.pcard .ph{background:#181a21;display:grid;place-items:center;position:relative;padding:8px 0}
.pcard .ph .inxi{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.pcard .ph .inxi svg{width:12px;fill:none;stroke:#fff;stroke-width:3}
.pcard .ph .tm{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .bd{padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center}
.pcard .tt{display:flex;gap:8px;align-items:center;min-width:0;text-align:left}
.pcard .tt b{font-size:17px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard .big{text-align:right;color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
.pcard .big b{color:var(--fg);font-size:26px;margin-left:4px}
.pcard .ln{display:flex;gap:8px;align-items:center;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .rt{text-align:right;font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pcard .rt b{color:var(--fg);margin-left:6px}
.ck{width:20px;height:20px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
.ck svg{width:12px;fill:none;stroke:#fff;stroke-width:3}
.ck.no{background:#5d6170}
.ic{width:20px;height:20px;flex:none;stroke:var(--muted);fill:none;stroke-width:2}
.boxes{display:flex;gap:3px}
.boxes i{font-style:normal;width:26px;height:26px;background:#3a3d49;display:grid;place-items:center;font-weight:700;font-size:13px;border-bottom:3px solid #5d6170}
.boxes i.p{border-bottom-color:var(--ok)} .boxes i.z{border-bottom-color:#e0a030} .boxes i.n{border-bottom-color:var(--bad)} .boxes i.x{color:var(--muted)}
.up{color:var(--ok)} .dn{color:var(--bad)}
.trend{font-size:12px;font-weight:700}
.hm{position:fixed;z-index:60;left:12px;top:calc(env(safe-area-inset-top,0px) + 62px);background:#22242d;border-radius:14px;min-width:220px;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden;animation:hmin .15s ease-out;transform-origin:top left}
.hm button{display:flex;align-items:center;gap:12px;width:100%;padding:15px 18px;font-size:16px;text-align:left;border-bottom:1px solid #2f323c}.hm button:last-child{border-bottom:0}.hm button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
@keyframes hmin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.vchips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 4px;max-width:640px;margin:0 auto}.vchips button{flex:none;padding:7px 13px;border-radius:18px;background:#22242d;color:var(--muted);font-size:14px;font-weight:600}.vchips button.on{background:var(--accent);color:#fff}
.vrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;padding:9px 12px;border-bottom:1px solid #22242d;text-align:left}.vrow .vn{min-width:0}.vrow .vn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}.vrow .vn small{color:var(--muted);font-size:12px}
.vph{position:relative;width:44px;height:44px;border-radius:50%;overflow:hidden;background:#181a21;display:grid;place-items:center}.vph .shirt:not(.foto){width:80%}
.vrow .vv{text-align:right}.vrow .vv b{display:block;font-size:15px}.vrow .vv span{font-size:12px;font-weight:700}.vlist{max-width:640px;margin:0 auto}
.mc{display:grid;grid-template-columns:20% minmax(0,1fr);background:#23252f;margin:0 -4px 8px}
.mc .ph{position:relative;background:#1b1c22;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;min-height:150px}
.mc .ph .shirt:not(.foto){width:80%;margin:auto}
.mc .ph .tmb{position:absolute;top:8px;right:4px;width:20px;z-index:2}
.cjt{margin:6px 2px 8px;font-size:16px}
.cal{display:grid;gap:8px}
.cm{background:var(--card);border-radius:10px;padding:8px 10px 10px}
.cm.me{box-shadow:inset 3px 0 0 var(--accent)}
.cm small{display:block;text-align:center;color:var(--muted);font-size:12px;margin-bottom:6px}
.cr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.ct{display:flex;align-items:center;gap:8px;min-width:0}
.ct.r{flex-direction:row-reverse;text-align:right}
.ct img.crest{width:30px;height:30px;object-fit:contain;flex:none}
.ct b{font-size:13px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cs{font-weight:800;font-size:18px;min-width:54px;text-align:center}
.cs.v{color:var(--muted);font-size:13px;font-weight:600}
.ofr{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ofr:first-of-type{border-top:0}
.ofn{text-align:left;min-width:0}.ofn b{display:block}.ofn small{color:var(--muted);font-size:12px}
.ofa{font-size:16px;white-space:nowrap}
.ofb{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.abtn.sm{padding:8px 16px;width:auto}
.ofban{display:block;width:100%;text-align:left;background:var(--accent);color:#fff;font-weight:700;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.cvt{display:grid;grid-template-columns:1fr 1fr;border:1px solid #343743;padding:4px;margin:4px 0 12px}
.cvt button{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 6px;font-size:17px;font-weight:600;color:#fff;border-radius:20px}
.cvt button.on{background:#2c2f3a}
.cvt .ar{width:20px;height:20px;border-radius:50%;display:inline-block;position:relative}
.cvt .ar.dn{background:#3b5bdb}.cvt .ar.up{background:#ee5a4b}
.cvt .ar::after{content:"";position:absolute;left:5px;border:5px solid transparent}
.cvt .ar.dn::after{top:7px;border-top-color:#fff}.cvt .ar.up::after{top:2px;border-bottom-color:#fff}
.vacio{text-align:center;padding:40px 16px}.vacio .sb{width:170px;height:auto}.vacio p{margin-top:28px;font-size:16px}
.lkg .ic{width:18px;height:18px;margin-right:8px;vertical-align:-3px}
.ftit{font-size:18px;font-weight:700;margin:0}
.ofw{padding:14px 10px 30px}
.ofc{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;background:#2a2c38;border-radius:4px;padding:12px;margin-top:14px;align-items:start}
.oav{width:54px;height:54px;border-radius:50%;background:#3c404d;display:grid;place-items:center;font-weight:900;font-size:22px;grid-row:span 2}
.oav.liga{background:#fff}.oav svg{width:34px;height:34px}
.ot b{display:block;font-size:15px}.oam{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-top:6px}
.ycoin{width:18px;height:18px;border-radius:50%;background:#c9a227;color:#14151b;font-style:normal;font-size:11px;font-weight:900;display:grid;place-items:center}
.otm{color:var(--muted);font-size:13px}
.obt{grid-column:2/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.orej{border:1px solid #9aa0ad;padding:10px;font-weight:700}.oacc{background:#e5534b;color:#fff;padding:10px;font-weight:700}
.oacc:disabled{opacity:.5}
.cfm{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.cfb{background:#fff;color:#14151b;border-radius:14px;padding:22px 18px 18px;width:100%;max-width:360px}
.cfb h3{font-size:20px;margin:0 0 16px}.cfb p{color:#333;font-size:15px;line-height:1.35;margin:0 0 18px}.cfb p b{color:#14151b}
.avx .cfb{padding:22px 0 0;text-align:center}.avx .cfb h3{margin-bottom:10px}.avx .cfb p{color:#6b6f7b;font-size:17px;padding:0 18px 26px;margin:0}.avx .cfb button{display:block;width:100%;border-top:1px solid #ddd;padding:16px;color:#16a34a;font-size:19px;font-weight:600}
.cfr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cfr button{background:#eee;border-radius:22px;padding:12px;font-size:16px;color:#14151b}
.toast.ok{background:#43a537;color:#fff;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:16px;width:calc(100% - 32px);padding:14px 16px}
.toast.ok button{color:#fff;font-size:22px;line-height:1}
.toast[hidden]{display:none!important}
/* menú Acciones (estilo iOS) y Fijar el precio de venta */
.sheet.ios{align-items:flex-end;background:rgba(0,0,0,.35);padding:0 0 calc(70px + env(safe-area-inset-bottom,0px))}
.iosm{width:62%;max-width:300px;background:rgba(190,190,195,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:30px;padding:10px;display:grid;gap:8px}
.iosm button{background:rgba(255,255,255,.22);border-radius:22px;padding:14px 10px;font-size:17px;color:#14151b;text-align:center}
.iosm button.pu{color:#8b5cf6}
.rv .rhd{display:grid;grid-template-columns:44px 44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.rv .rav{width:40px;height:40px;border-radius:50%;background:#d8dade;color:#6b6f7b;display:grid;place-items:center;font-weight:800;font-size:18px}
.rv .rnm{min-width:0}.rv .rnm b{display:block;font-size:15px;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv .rnm small{display:flex;align-items:center;gap:5px;color:#9aa0ad;font-size:12px}.rv .rnm small svg{width:12px;height:12px;fill:#9aa0ad}
.rv .rpt{font-weight:800;font-size:16px;white-space:nowrap}.rv .rpt small{color:#9aa0ad;font-size:9px;font-weight:700;margin-left:3px;vertical-align:4px}
.rv .rtab{margin-bottom:8px}.rv .rtab button.on{border-bottom-color:#e5352b}
.lkr{display:inline-flex;align-items:center;gap:8px;color:var(--fg)}.lkr .lc{width:20px;height:20px;border-radius:50%;background:var(--ok);display:grid;place-items:center}.lkr .lc svg{width:11px;height:11px;fill:none;stroke:#14151b;stroke-width:2.6}
.lkr .lc.r{background:#e5534b}.lkr .lc.r svg{stroke:#fff}
.rv .pcard .abtn{background:#e5352b;border-radius:0}
.rjs{display:flex;gap:10px;overflow-x:auto;padding:12px 14px 16px;scrollbar-width:none}.rjs::-webkit-scrollbar{display:none}
.rj{flex:none;width:44px;height:44px;border-radius:50%;background:#2a2c35;color:#9aa0ad;font-size:13px;font-weight:700;display:grid;place-items:center;line-height:1.05}
.rj.on{background:#18a33a;color:#fff;width:48px;height:48px}.rj small{display:block;font-size:11px;font-weight:600}
.iosm button.dis{color:rgba(20,21,27,.35)}
.lnk{color:#e5534b;font-size:14px;text-decoration:underline}
.spill .clr{width:30px;height:30px;border-radius:50%;background:#14151b;display:grid;place-items:center;flex:none;color:#fff;font-size:18px;line-height:1}
.pres{position:fixed;inset:0;z-index:70;background:#0e0f15 repeating-linear-gradient(115deg,transparent 0 120px,rgba(255,255,255,.025) 120px 220px);display:flex;flex-direction:column;overflow-y:auto}
.pres h1{font-size:17px;font-weight:700;text-align:center;margin:0;padding:calc(16px + env(safe-area-inset-top,0px)) 0 14px}
.pres .pbar{display:flex;align-items:center;gap:10px;background:#23252f;padding:6px 10px;max-width:640px;width:100%;margin:0 auto}
.pres .pbar .rav{width:34px;height:34px;border-radius:50%;background:#d8dade;color:#6b6f7b;display:grid;place-items:center;font-weight:800}
.pres .pbar b{flex:1;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pres .pbar small{font-weight:900;font-size:10px;letter-spacing:.3px}
.pres .pg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;padding:14px 16px;max-width:640px;width:100%;margin:0 auto}
.pres .pinf{grid-column:span 2;font-size:15px;font-weight:600}.pres .pinf small{display:block;color:#8d92a0;font-size:10px;font-weight:700;margin-top:4px}.pres .pinf div{margin-bottom:10px}
.pres .pinf .coin{width:14px;height:14px;font-size:9px;margin-left:4px;vertical-align:-1px}
.pc{position:relative;aspect-ratio:3/4.1;perspective:600px}
.pc .bk,.pc .fr{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pc .bk{background:#262833;display:grid;place-items:center;color:#3a3d49;font-weight:900;font-size:11px;letter-spacing:.5px}
.pc .fr{background:#2a2c37;display:flex;flex-direction:column;transform:rotateY(180deg)}
.pc.go .bk{animation:pcb .45s forwards;animation-delay:var(--d)}.pc.go .fr{animation:pcf .45s forwards;animation-delay:var(--d)}
@keyframes pcb{to{transform:rotateY(-180deg)}}@keyframes pcf{to{transform:rotateY(0)}}
.pc .fr .ph{flex:1;position:relative;overflow:hidden;display:grid;place-items:end center}.pc .fr .ph .shirt:not(.foto){width:80%}
.pc .fr .ph .crest{position:absolute;top:3px;right:3px;width:14px;z-index:2}
.pc .fr .ck{position:absolute;right:3px;bottom:3px;z-index:3;width:16px;height:16px}
.pc .fr .nm{background:#f4f5f7;color:#14151b;font-size:10px;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- servidor ---------- */
async function api(action, body) {
  const r = await fetch(CFG.api, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + tok() }, body: JSON.stringify({ action, lg: LG, ...(body || {}) }) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.error || "Error de conexión"); err.status = r.status; throw err; }
  return j;
}
let busy = false;
async function refresh(pre) {
  if (busy) return; busy = true;
  try { const p0 = pre && await pre; if (p0 instanceof Error) throw p0; const st = p0 || await api("state"); S.skew = st.now - Date.now(); S.st = st; S.store = "ok"; if (st.lg !== LG) setLg(st.lg);
    if (st.lg && st.team && st.team.joined && st.team.pres !== st.team.joined && (st.team.squad || []).length && (!S.sheet || S.sheet.t !== "present")) {   // la presentación solo la primera vez (se apunta en el servidor)
      let seen = false; try { seen = !!localStorage.getItem("pres:" + st.lg + ":" + st.team.joined); } catch (e) {}
      if (seen) markPresented(); else if (!S.sheet) S.sheet = { t: "present" }; }
    render(); }
  catch (e) { if (e.status === 401) { S.store = "auth"; render(); } }
  busy = false;
}
async function act(action, body, okMsg) {
  try { await api(action, body); if (okMsg) toast(okMsg); await refresh(); return true; }
  catch (e) { toast(e.message); return false; }
}
// Notificaciones push: avisan cuando otro mánager te hace una oferta
function notifBox() {
  const ok = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent), standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let body;
  if (!ok) body = ios && !standalone ? `<p>En iPhone, primero añade la app a la pantalla de inicio (Compartir › Añadir a pantalla de inicio) y ábrela desde ahí.</p>` : `<p>Este navegador no admite notificaciones.</p>`;
  else if (Notification.permission === "granted" && S.pushOn) body = `<p>Activadas: te avisaremos cuando te hagan una oferta.</p>`;
  else if (Notification.permission === "denied") body = `<p>Las tienes bloqueadas. Actívalas en los ajustes del móvil para esta app.</p>`;
  else body = `<p>Te avisamos cuando otro mánager te haga una oferta.</p><button class="abtn" data-act="pushon">Activar notificaciones</button>`;
  return `<div class="box"><h3>Notificaciones</h3>${body}</div>`;
}
async function pushOn(ask) {
  try {
    if (!("serviceWorker" in navigator && "PushManager" in window && "Notification" in window)) return;
    if (ask) { if ((await Notification.requestPermission()) !== "granted") { toast("No has dado permiso para las notificaciones."); return render(); } }
    else if (Notification.permission !== "granted") return;
    const reg = await navigator.serviceWorker.ready; let sub = await reg.pushManager.getSubscription();
    if (!sub) { const { key } = await api("pushKey"); const raw = atob(key.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((key.length + 3) % 4));
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Uint8Array.from(raw, ch => ch.charCodeAt(0)) }); }
    await api("pushSub", { sub: sub.toJSON() }); S.pushOn = true; if (ask) { toastOk("Notificaciones activadas"); render(); }
  } catch (e) { if (ask) toast("No se han podido activar: " + e.message); }
}
// Al entrar, una sola vez: ¿quieres activar las notificaciones?
function pushAsk() {
  try { if (!("serviceWorker" in navigator && "PushManager" in window && "Notification" in window) || Notification.permission !== "default" || S.store !== "ok" || !S.st.lg || S.sheet || localStorage.getItem("pushAsk")) return;
    localStorage.setItem("pushAsk", "1"); } catch (e) { return; }
  const d = document.createElement("div"); d.className = "cfm avx"; d.dataset.avx = "1";
  d.innerHTML = `<div class="cfb"><h3>Notificaciones</h3><p>¿Quieres activar las notificaciones para enterarte cuando te hagan una oferta?</p><button data-act="pushask">Activar</button><button data-avx="1" style="color:#6b6f7b;font-weight:500">Ahora no</button></div>`; document.body.appendChild(d);
}
function hideSplash() { const sp = document.getElementById("splash"); if (!sp || sp.classList.contains("out")) return; sp.classList.add("out"); setTimeout(() => sp.remove(), 400); }
async function boot() {
  setTimeout(hideSplash, 12000);   // por si algo falla, que no se quede siempre
  fetch("/fotos.json").then(r => r.ok ? r.json() : []).then(a => { a.forEach(id => FOTOS.add(String(id))); if (S.store === "ok") render(); }).catch(() => {});
  const st0 = tok() ? api("state").catch(e => e) : null;   // a la vez que liga.json: carga más rápido
  try { const r = await fetch("/liga.json"); S.liga = await r.json(); S.liga.players.forEach(p => PMAP[p.id] = p); }
  catch (e) { hideSplash(); document.getElementById("main").innerHTML = '<div class="empty">No se han podido cargar los datos de la liga.</div>'; return; }
  if (!tok()) { S.store = "auth"; return render(); }

async function auth(mode) {

  if (u.length < 2 || pw.length < 6) { S.authMsg = "El usuario necesita 2 letras o más y la contraseña 6 caracteres o más."; return render(); }
  S.authMsg = mode === "up" ? "Creando cuenta…" : "Entrando…"; render();
  try { const { token } = await api(mode === "up" ? "register" : "login", { username: u, password: pw });
    try { localStorage.setItem(TK, token); } catch (e) {}
    S.authMsg = ""; await refresh(); setInterval(() => { if (!document.hidden && !S.sheet && !document.querySelector("input:focus")) refresh(); }, 15000); setInterval(tickTimers, 1000);
  } catch (e) { S.authMsg = e.message; render(); }
}
function authView() {

  main.innerHTML = (v === "team" && !S.st.team.name ? welcome() : "") +

/* ---- Alineación ---- */
function lineView() {
  const c = cur(), l = myLineup(), lk = locked(), rows = GAME.FORMS[l.f], sq = new Set(mySquad());
  const lastJ = allJ().filter(J => J.matches && J.matches.length).slice(-1)[0];
  let i = 1; const lines = [[["POR", 0]]].concat([["DEF", rows[0]], ["CEN", rows[1]], ["DEL", rows[2]]].map(([pos, n]) => { const a = []; for (let k = 0; k < n; k++) a.push([pos, i++]); return a; }));
  const slot = ([pos, idx]) => {
    const id = l.s[idx], p = id && sq.has(id) ? PL(id) : null;
    if (!p) return `<button class="slot empty" data-slot="${idx}" data-pos="${pos}" ${lk ? "disabled" : ""}><div class="face">${SIL}</div><div class="nm">${pos}</div></button>`;
    const pp = lastJ ? ptsOf(id, lastJ) : null, played = lastJ && lastJ.st[id];
    return `<button class="slot full" data-slot="${idx}" data-pos="${pos}"><div class="face">${shirt(p)}${l.c === id ? `<span class="cap">${CROWN}</span>` : ""}</div><div class="nm">${esc(p.n)}</div>${lastJ ? `<span class="badge ${!played ? "z" : pp < 0 ? "neg" : ""}" title="Puntos en la J${lastJ.n}">${played ? pp : "–"}</span>` : ""}</button>`;
  };
  const opts = Object.keys(GAME.FORMS).map(f => `<option value="${f}" ${f === l.f ? "selected" : ""}>${f.replace(/-/g, "·")}</option>`).join("");
  const filled = l.s.filter(x => x && sq.has(x)).length;
  return rewardBox() +
    (lk ? `<div class="lockmsg">La jornada ${c.n} ya ha empezado. La alineación está cerrada hasta que se publiquen los puntos.</div>` : "") +
    `<div class="row2"><select class="form" id="form" ${lk ? "disabled" : ""} aria-label="Formación">${opts}</select>
      <button class="capbtn ${S.capMode ? "on" : ""}" data-act="cap" ${lk ? "disabled" : ""}>${CROWN} ${S.capMode ? "Toca un jugador" : "Asignar capitán"}</button></div>
    <div class="note">${filled}/11 alineados${filled < 11 ? " · Con menos de 11 no puntúas." : ""} · Los números son los puntos de la J${lastJ ? lastJ.n : "-"}. Toca un jugador para cambiarlo o ver su ficha.</div>
    <div class="pitch">${lines.map(L => `<div class="line">${L.map(slot).join("")}</div>`).join("")}</div>`;
}

  return `<div class="mc"><button class="ph" data-ficha="${id}" aria-label="Ver ficha de ${esc(p.n)}">${shirt(p, 80)}<span class="tmb">${crest(p.t)}</span></button>
    <div class="bd"><button class="r1" data-ficha="${id}"><span class="pos ${posOf(id)}">${posOf(id)}</span><b>${esc(p.n)}</b><span class="pf">PFSY<b>${se.pf}</b></span></button>
      <div class="r2"><span><span class="lg">${item.seller === "LIGA" ? "L" : esc((teamName(item.seller) || "?")[0].toUpperCase())}</span>${item.seller === "LIGA" ? "LIGA" : esc(teamName(item.seller))}</span><span class="kv">Valor<em>${eur(val(id))}</em></span></div>
      <div class="r2"><span><span class="ck">${CHK}</span>Alineable</span><span class="kv">Precio<b>${eur(item.price)}</b></span></div>
      <div class="r3"><span>${CLOCK}<span data-ends="${item.ends}">${hms(item.ends - now())}</span></span>${item.nb ? `<span class="nb">${item.nb} pujas</span>` : ""}${btn}</div></div></div>`;
}
// Cláusula en las tarjetas: candado rojo y lo que falta mientras está blindado (días, o hh:mm:ss si queda menos de 24 h); si no, candado verde y su importe
function lockCell(id) {
  const ci = clauseInfo(id); if (!ci) return "";
  const LK = c => `<span class="lc ${c}"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0"/></svg></span>`, left = ci.until - now();
  if (left > 0) return `<span class="lkr">${LK("r")}${left >= 864e5 ? Math.ceil(left / 864e5) + " días" : `<span data-ends="${ci.until}">${hms(left)}</span>`}</span>`;
  return `<span class="lkr">${LK("")}${eur(ci.c)}</span>`;
}
function pcard(id, mode, item) {
  const p = PL(id), se = seasonOf(id), js = allJ().slice(-5), v = val(id), prev = S.st.prices.prev[id] || v;
  const boxes = js.map(J => { const m = GAME.mins(J, id), pt = ptsOf(id, J); return `<i class="${!(m > 0) ? "x" : pt > 4 ? "p" : pt > 0 ? "z" : "n"}">${m > 0 ? pt : "–"}</i>`; }).join("");
  const inL = (mode === "squad" || mode === "pick") && myLineup().s.includes(id), d = v - prev;
  const trend = d ? `<span class="trend ${d > 0 ? "up" : "dn"}">${d > 0 ? "▲ +" : "▼ "}${eur(d)}</span>` : `<span class="trend" style="color:var(--muted)">=</span>`;
  let mid, btn;
  if (mode === "market") {
    const my = S.st.myBids[id], mine = item.seller === S.st.me;
    mid = `<div class="ln">${CLOCK}<span data-ends="${item.ends}">${hms(item.ends - now())}</span></div><div class="rt">Precio<b>${eur(item.price)}</b></div>
      <div class="ln"><span class="ck">${CHK}</span>${item.seller === "LIGA" ? "LIGA" : esc(teamName(item.seller))}</div><div class="rt">Valor<b>${eur(v)}</b></div>`;

/* ---- Calendario de la liga real (resultados de las actas + calendario FFCV) ---- */
function calView() {
  const res = {}; allJ().forEach(J => { if (J.matches && J.matches.length) res[J.n] = J.matches; });
  const cal = S.liga.calendar || {}, ns = [...new Set([...Object.keys(res), ...Object.keys(cal)].map(Number))].sort((a, b) => a - b);
  if (!ns.length) return '<div class="empty">Aún no hay calendario.</div>';
  const jn = S.cj || (ns.find(n => !res[n]) || ns[ns.length - 1]);
  const DOW = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"], MON = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const fd = s => { if (!s) return ""; const [d, h] = s.split("T"), [y, m, dd] = d.split("-").map(Number), w = new Date(Date.UTC(y, m - 1, dd)).getUTCDay(); return `${DOW[w]} ${dd} ${MON[m - 1]}${h ? " · " + h : ""}`; };
  const side = (t, r) => `<span class="ct ${r ? "r" : ""}">${crest(t)}<b>${esc(team(t).name || team(t).short)}</b></span>`;
  let ms;
  if (res[jn]) ms = res[jn].map(([h, a, hg, ag, d]) => ({ h, a, mid: `<span class="cs">${hg} - ${ag}</span>`, d }));
  else ms = (cal[jn] || []).map(([h, a, d]) => ({ h, a, mid: `<span class="cs v">vs</span>`, d }));
  ms.sort((x, y) => (x.d || "").localeCompare(y.d || ""));
  return `<div class="chips" id="cjs">${ns.map(n => `<button data-cj="${n}" class="${n === jn ? "on" : ""}">J${n}</button>`).join("")}</div>
    <h3 class="cjt">Jornada ${jn}${res[jn] ? "" : " · pendiente"}</h3>
    <div class="cal">${ms.map(m => `<div class="cm ${m.h === MY_T || m.a === MY_T ? "me" : ""}"><small>${fd(m.d)}</small><div class="cr">${side(m.h)}${m.mid}${side(m.a, 1)}</div></div>`).join("")}</div>`;
}
function tableView() {
  if (S.sub.table === "cal") return calView();
  const pl = fantasyJ(), sub = S.sub.table, jn = S.tj || (pl.length ? pl[pl.length - 1].n : null), P = S.st.points || {};
  const rows = Object.entries(S.st.teams).map(([u, t]) => { let total = 0; pl.forEach(J => total += (P[J.n] || {})[u] || 0);
    return { u, t, total: sub === "gen" ? total : ((P[jn] || {})[u] ?? null), value: (t.squad || []).reduce((s, id) => s + val(id), 0) }; })
    .sort((a, b) => (b.total ?? -999) - (a.total ?? -999) || b.value - a.value);
  const chips = sub === "jor" ? (pl.length ? `<div class="chips">${pl.map(J => `<button data-tj="${J.n}" class="${J.n === jn ? "on" : ""}">J${J.n}</button>`).join("")}</div>` : '<div class="empty">Aún no hay jornadas puntuadas.</div>') : "";
  if (sub === "jor" && !pl.length) return chips;
  return chips + `<div class="tbl">${rows.map((r, i) => `<button class="tr ${r.u === S.st.me ? "me" : ""}" data-rival="${esc(r.u)}"><div class="n">${i + 1}</div><div class="t"><b>${esc(r.t.name || r.u)}</b><small>${esc(r.u)} · ${eur(r.value)} €</small></div>

// Mismo cálculo que datos/extraer_liga.js (GAME.parseActa): minutos, goles, gol decisivo, encajados en el campo, tarjetas…
function parseActas(files) {
  const byName = {}; S.liga.teams.forEach((t, i) => byName[t.name.toLowerCase()] = i);
  const tid = n => byName[String(n).toLowerCase()];
  const out = { n: null, matches: [], st: {}, unknown: 0 };
  for (const d of files) {
    if (!d || !d.resultado || !d.alineaciones) throw new Error("Algún archivo no es un acta.");
    if (out.n != null && d.jornada !== out.n) throw new Error("Hay actas de jornadas distintas.");
    const r = GAME.parseActa(d, tid); out.n = r.n; out.matches.push(r.match);
    Object.entries(r.st).forEach(([pid, x]) => { if (PL(pid)) out.st[pid] = x; else out.unknown++; });
  }
  return out;
}

function searchResults(q) {

  if (a === "logout") { api("logout").catch(() => {}); try { localStorage.removeItem(TK); } catch (e) {} return location.reload(); }
  if (a === "bidclr") { const i = document.getElementById("bidv"); i.value = ""; i.focus(); return; }
  if (a === "dobid") { const v = +String(document.getElementById("bidv").value).replace(/\D/g, ""); const id = S.sheet.id, it = S.st.market.find(i => i.pid === id), mn = it ? Math.max(it.price, val(id)) : 0;
    if (!(v >= mn)) return toast("No puedes pujar por menos de su valor: " + eur(mn) + " €.");
    const gb = document.querySelector('[data-act="dobid"]'); if (gb) { if (gb.disabled) return; gb.disabled = true; gb.textContent = "Pujando…"; }
    try { await api("bid", { pid: id, amount: v }); } catch (e) { if (gb) { gb.disabled = false; gb.textContent = "Hacer puja"; } return /endeudamiento/.test(e.message) ? aviso(e.message) : toast(e.message); }
    S.st.myBids[id] = v; toastOk("Has pujado " + eur(v) + " € por " + PL(id).n); S.sheet = S.sheet && S.sheet.prev || null; render(); refresh(); return; }
  if (a === "nobid") { const id = S.sheet.id; S.sheet = null; return act("bid", { pid: id, amount: 0 }, "Puja retirada"); }
  if (a === "offerask") { S.sheet.confirm = true; return renderSheet(); }
  if (a === "offerok") { const id = S.sheet.id, it = S.st.market.find(i => i.pid === id && i.seller === S.st.me); S.sheet = null; return act("acceptOffer", { pid: id }, "Vendido a LIGA por " + eur(it ? it.offer : 0) + " €"); }
  if (a === "clauseask") { S.sheet.clause = true; return renderSheet(); }
  if (a === "clauseok") { const id = b.dataset.pid; S.sheet = S.sheet.prev || null; return act("payClause", { pid: id }, "¡Clausulazo! " + PL(id).n + " ya es tuyo"); }
  if (a === "mofask") { S.sheet.mof = true; return renderSheet(); }
  if (a === "mofok") { const id = S.sheet.id, v = +document.getElementById("mofv").value; S.sheet.mof = false; return act("mgrOffer", { pid: id, amount: v }, "Oferta enviada a " + teamName(ownerOf(id))); }
  if (a === "raiseask") { S.sheet.raise = true; return renderSheet(); }
  if (a === "raiseok") { const id = S.sheet.id, v = +document.getElementById("raisev").value; S.sheet = S.sheet.prev || null; return act("raiseClause", { pid: id, amount: v }, "Cláusula subida"); }
  if (a === "listask") { S.sheet.list = true; return renderSheet(); }
  if (a === "sellpage") { S.sheet = { t: "sell", id: S.sheet.id, prev: S.sheet.prev }; return renderSheet(); }
  if (a === "pen") { const i = document.querySelector(".spill input"); i.focus(); i.select(); return; }
  if (a === "mofclr") { const i = document.getElementById("mofv"); i.value = ""; i.focus(); return; }
  if (a === "oldacts") { S.sheet.old = 1; return renderSheet(); }
  if (a === "mofpage") { const rv = S.sheet; if (rv) rv.menu = null; S.sheet = { t: "mof", id: b.dataset.pid, prev: rv ? (rv.t === "acts" ? rv.prev : rv) : null }; return renderSheet(); }
  if (a === "rclause") { const id = b.dataset.pid, ci = clauseInfo(id);
    if (!ci) return; if (now() < ci.until) return toast("Blindado hasta el " + fmtWhen(ci.until) + "."); if (GAME.clauseBlocked(now())) return toast("Los viernes no se pueden pagar cláusulas.");
    if (S.st.team.money < ci.c) return toast("Te faltan " + eur(ci.c - S.st.team.money) + " € para pagar la cláusula.");
    S.sheet.menu = null; S.sheet.cl = id; S.sheet.keep = true; renderSheet(); S.sheet.keep = false; return; }
  if (a === "mofgo") { const id = S.sheet.id, v = +String(document.getElementById("mofv").value).replace(/\D/g, "");
    if (!(v >= val(id))) return toast("La oferta mínima es su valor: " + eur(val(id)) + " €.");
    const prev = S.sheet.prev || null; S.sheet = prev; if (await act("mgrOffer", { pid: id, amount: v })) toastOk("Has hecho una oferta de " + eur(v) + " € por " + PL(id).n); else renderSheet(); return; }
  if (a === "listok") { const id = S.sheet.id, v = +String(document.getElementById("listv").value).replace(/\D/g, "");
    if (!(v >= val(id))) return toast("El precio mínimo es su valor: " + eur(val(id)) + " €.");
    const prev = S.sheet.prev || null; S.sheet = prev; if (await act("list", { pid: id, price: v })) toastOk("Has añadido a " + PL(id).n + " al mercado correctamente"); else renderSheet(); return; }
  if (a === "autoj") { b.disabled = true; try { const r = await api("autoJornada", {}); S.autoMsg = r.msg; await refresh(); } catch (e) { S.autoMsg = e.message; render(); } return; }
  if (a === "pub") { const J = S.imp; if (!J || J.err) return; b.disabled = true; if (await act("importJornada", { jornada: { n: J.n, matches: J.matches, st: J.st } }, "Puntos de la J" + J.n + " publicados")) { S.imp = null; render(); } else b.disabled = false; return; }
});
function confirm2(b) { if (b.dataset.sure) return true; b.dataset.sure = "1"; b.textContent = "¿Seguro?"; return false; }
document.addEventListener("submit", e => { if (e.target.id === "auform") { e.preventDefault(); auth(S.authTab === "up" ? "up" : "in"); } });
document.addEventListener("input", e => { if ((e.target.id === "listv" && S.sheet && S.sheet.t === "sell") || e.target.id === "mofv" || e.target.id === "bidv") { e.target.value = fmtN(+e.target.value.replace(/\D/g, "")); return; } if (e.target.id === "sq") { S.sheet.q = e.target.value; const r = document.getElementById("sres"); if (r) r.innerHTML = searchResults(S.sheet.q); } });
document.addEventListener("change", async e => {
  if (e.target.id === "form") { const f = e.target.value, l = myLineup(), rows = GAME.FORMS[f];
    const byPos = { POR: [], DEF: [], CEN: [], DEL: [] }; l.s.forEach(id => { if (id && PL(id)) byPos[posOf(id)].push(id); });
    const s = [byPos.POR[0] || null]; [["DEF", rows[0]], ["CEN", rows[1]], ["DEL", rows[2]]].forEach(([pos, n]) => { for (let k = 0; k < n; k++) s.push(byPos[pos][k] || null); });
    return saveLineup({ f, s, c: s.includes(l.c) ? l.c : null }); }
  if (e.target.id === "setpos") return act("setPos", { pid: e.target.dataset.pid, pos: e.target.value }, "Posición cambiada");
  if (e.target.id === "actas") {
    try { const files = await Promise.all([...e.target.files].map(f => f.text().then(JSON.parse))); S.imp = parseActas(files);
      if (S.imp.n < GAME.FIRST_J) S.imp.err = "Esa jornada (" + S.imp.n + ") es anterior a la J" + GAME.FIRST_J + "."; }
    catch (err) { S.imp = { err: err.message || "No se han podido leer los archivos." }; }
    render();
  }
});
boot();
</script>
