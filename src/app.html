const START_DAY = "2026-11-16";       // primer día de mercado (los precios cambian a las 00:00, hora de Madrid)

const DAILY = 100000;                  // recompensa diaria
const PER_POINT = 100000;              // € por punto conseguido en la jornada
const GOL = { POR: 10, DEF: 6, CEN: 5, DEL: 4 };
const CLEAN = { POR: 4, DEF: 3, CEN: 1, DEL: 0 };
const FORMS = { "4-4-2": [4, 4, 2], "4-3-3": [4, 3, 3], "3-5-2": [3, 5, 2], "3-4-3": [3, 4, 3], "4-5-1": [4, 5, 1], "5-3-2": [5, 3, 2], "5-4-1": [5, 4, 1] };
const POSN = { POR: "Portero", DEF: "Defensa", CEN: "Centrocampista", DEL: "Delantero" };

/* ---------- jugadores y precio base (según los puntos reales de J1–J8) ---------- */
const baseValue = e => Math.round((600000 + Math.max(0, e) * 90000) / 10000) * 10000;
let PLAYERS = [];
function buildPlayers(extra) {
  PLAYERS = PLANTILLA.map(([id, d, n, pos, full]) => ({ id, dorsal: d, nombre: n, full, pos }));
  (extra || []).forEach(x => { if (!x || !x.id || PLAYERS.some(p => p.id === x.id)) return;
    PLAYERS.push({ id: x.id, dorsal: x.dorsal || "", nombre: String(x.nombre || "Jugador"), pos: GOL[x.pos] != null ? x.pos : "CEN", v0: +x.valor || 800000 }); });
  PLAYERS.forEach(p => { if (p.v0 == null) p.v0 = baseValue(Object.values(ACTAS).reduce((s, J) => s + pts(p, J), 0)); });
}
const PL = id => PLAYERS.find(p => p.id === id);

/* ---------- puntos de un jugador en una jornada (del acta) ---------- */
function ptsBreak(p, J) {
  const s = J && J.st && J.st[p.id]; if (!s) return null;
  if (!(+s.m > 0)) return s.y || s.r || s.pp ? [["Tarjeta en el banquillo", -(+s.y >= 2 || s.r ? 3 : +s.y ? 1 : 0)]] : null;
  const m = +s.m, out = [], add = (t, v) => { if (v) out.push([t, v]); };
  add(m >= 60 ? "Juega 60' o más" : "Juega menos de 60'", m >= 60 ? 2 : 1);
  add("Goles (" + (+s.g || 0) + ")", (+s.g || 0) * GOL[p.pos]);
  if (m >= 60 && +J.gc === 0) add("Portería a cero", CLEAN[p.pos]);
  if (m >= 60 && (p.pos === "POR" || p.pos === "DEF")) add("Goles encajados (" + (+J.gc || 0) + ")", -Math.floor((+J.gc || 0) / 2));
  if (+J.gf > +J.gc) add("Victoria", 2); else if (+J.gf === +J.gc) add("Empate", 1);
  add("Gol en propia puerta", -2 * (+s.pp || 0));
  const y = +s.y || 0;
  if (y === 1) add("Amarilla", -1);
  if (y >= 2) add("Doble amarilla", -3); else if (s.r) add("Roja directa", -3);
  return out;
}
const pts = (p, J) => { const b = ptsBreak(p, J); return b ? b.reduce((a, x) => a + x[1], 0) : 0; };
buildPlayers([]);

/* ---------- utilidades ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const dayOf = t => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Madrid", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(t));

const addDay = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };

const S = { view: "team", sub: { team: "line", market: "mk", table: "gen", more: "rules" }, uid: null, admin: false, store: "loading",

/* ---- modo local (abierto como fichero): mismo interfaz que db, en este navegador ---- */
function localDB() {
  const KEY = "almac-fantasy-v1", subs = [];
  let data; try { data = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { data = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
  const snapDoc = path => ({ id: path.split("/").pop(), exists: path in data, data: () => data[path] });
  const fire = () => subs.forEach(s => s());
  const coll = c => ({ onSnapshot(fn) { const run = () => fn({ docs: Object.keys(data).filter(k => k.startsWith(c + "/") && k.split("/").length === c.split("/").length + 1).map(snapDoc) }); subs.push(run); setTimeout(run, 0); return () => {}; } });
  return { collection: coll, doc: path => ({ async set(v) { data[path] = JSON.parse(JSON.stringify(v)); save(); fire(); }, async get() { return snapDoc(path); },
    onSnapshot(fn) { const run = () => fn(snapDoc(path)); subs.push(run); setTimeout(run, 0); return () => {}; } }) };
}

/* ---- versión web (Vercel): cuentas con usuario y contraseña, datos en el servidor ---- */

async function api(action, body) {

  return j;
}
function apiDB() {
  let last = { jornadas: {}, teams: {}, plantilla: null }; const subs = { jornadas: [], teams: [], plantilla: [] };

    subs.plantilla.forEach(fn => fn({ id: "plantilla", exists: !!last.plantilla, data: () => last.plantilla })); };
  const poll = async () => { try { last = await api("state"); Object.keys(last.teams).forEach(k => S.names[k] = { name: k }); emit(); } catch (e) { if (e.status === 401) { S.store = "auth"; render(); } } };
  setInterval(() => { if (!document.hidden) poll(); }, 6000); poll();

    collection: c => ({ onSnapshot(fn) { (subs[c] || []).push(fn); return () => {}; } }),
    doc: path => ({
      onSnapshot(fn) { if (path === "liga/plantilla") subs.plantilla.push(fn); return () => {}; },

async function connect() {
  if (CFG.api) return connectApi();

  try {

function goLocal() { db = localDB(); S.uid = "local"; S.admin = true; S.store = "local"; S.names.local = { name: "Tú" }; subscribe(() => {}); }
function subscribe(ok) {
  db.collection("jornadas").onSnapshot(snap => { ok(); const o = {}; snap.docs.forEach(d => { const v = d.data(); if (v && v.n) o[v.n] = v; }); S.jornadas = o; render(); }, () => { ok(); render(); });
  db.collection("teams").onSnapshot(async snap => { ok(); const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S.teams = o;

/* ---------- jornadas ---------- */
// Jornadas: las de las actas (J1–J8) + lo que guarde el administrador. El calendario rellena rival y hora.
const CAL = n => { const c = CALENDARIO.find(x => x[0] === n); return c ? { n, rival: c[1], local: c[2], inicio: c[3] } : null; };
const Js = () => { const o = {}; Object.values(ACTAS).forEach(J => o[J.n] = J); Object.values(S.jornadas).forEach(J => o[J.n] = { ...(CAL(J.n) || {}), ...J }); return Object.values(o).sort((a, b) => a.n - b.n); };
const played = () => Js().filter(j => j.jugada);
const FIRST_J = 9;   // el fantasy empieza a puntuar en la jornada 9
const fplayed = () => played().filter(j => j.n >= FIRST_J);
// Jornada en juego: la primera creada y sin puntos publicados; si no hay, la siguiente a la última jugada
function curJ() { const open = Js().find(j => !j.jugada); if (open) return open; const l = played().pop(), n = l ? l.n + 1 : 9; return { ...(CAL(n) || {}), n, virtual: true }; }
const locked = J => !J.jugada && J.inicio && Date.now() >= new Date(J.inicio).getTime();

/* ---------- equipos ---------- */
const myTeam = () => S.teams[S.uid] || { name: "", ops: [], lineups: {} };
function squadOf(t) { const s = new Set(); (t.ops || []).forEach(o => { if (o.t === "buy") s.add(o.pid); else if (o.t === "sell") s.delete(o.pid); }); return [...s].filter(PL); }
function lineupFor(t, n) {
  const L = t.lineups || {}; let k = null;
  Object.keys(L).map(Number).filter(x => x <= n).forEach(x => { if (k == null || x > k) k = x; });
  const l = k != null ? L[k] : null; return l ? { f: FORMS[l.f] ? l.f : "4-4-2", s: (l.s || []).slice(0, 11), c: l.c || null } : { f: "4-4-2", s: Array(11).fill(null), c: null };
}
function teamJPts(t, J) {   // null = no puntúa (alineación incompleta)
  const l = lineupFor(t, J.n), ids = l.s.filter(Boolean);
  if (ids.length < 11) return { total: null, l };
  let total = 0; ids.forEach(id => { const p = PL(id); if (p) total += pts(p, J) * (id === l.c ? 2 : 1); });
  return { total, l };
}
function teamTotals(t) { let total = 0; const per = {}; fplayed().forEach(J => { const r = teamJPts(t, J); per[J.n] = r.total; total += r.total || 0; }); return { total, per }; }
function money(t) {
  let m = START_MONEY; (t.ops || []).forEach(o => { if (o.t === "buy") m -= o.price; else if (o.t === "sell") m += o.price; else if (o.t === "daily") m += DAILY; });
  fplayed().forEach(J => { const r = teamJPts(t, J); if (r.total > 0) m += r.total * PER_POINT; }); return m;
}

/* =====================================================================
   PRECIOS DIARIOS: rendimiento + oferta y demanda
   Cada día (00:00 hora de Madrid) el precio de cada jugador cambia:
   · Demanda: fichajes menos ventas de ese jugador el día anterior → +4 % por compra neta (tope ±12 %).
   · Popularidad: si lo tiene más de 1 de cada 4 equipos sube un poco, si no lo tiene nadie baja un poco (±1 %).
   · Rendimiento: el día siguiente a publicar una jornada, (puntos − 3) × 4 % (tope −15 % / +25 %).
   ===================================================================== */
let PRICE = { day: null, key: "", map: {} };
function prices() {
  const tday = today(), opsAll = [], teams = Object.values(S.teams);
  teams.forEach(t => (t.ops || []).forEach(o => { if (o.t === "buy" || o.t === "sell") opsAll.push(o); }));
  const key = tday + "|" + opsAll.length + "|" + played().map(j => j.n + ":" + j.publicada).join(",") + "|" + PLAYERS.length + "|" + teams.length;
  if (PRICE.key === key) return PRICE.map;
  const net = {}, own = {}; // net[day][pid]
  opsAll.sort((a, b) => a.at - b.at).forEach(o => { const d = dayOf(o.at); (net[d] = net[d] || {})[o.pid] = (net[d][o.pid] || 0) + (o.t === "buy" ? 1 : -1); });
  const perf = {}; played().forEach(J => { if (!J.publicada) return; const d = addDay(dayOf(J.publicada), 1); (perf[d] = perf[d] || []).push(J); });
  const map = {}; PLAYERS.forEach(p => map[p.id] = { v: p.v0, hist: [[START_DAY, p.v0]] });
  const nTeams = Math.max(1, teams.length);
  for (let d = addDay(START_DAY, 1); d <= tday; d = addDay(d, 1)) {
    const prev = addDay(d, -1), nd = net[prev] || {};
    Object.keys(nd).forEach(pid => own[pid] = (own[pid] || 0) + nd[pid]);
    PLAYERS.forEach(p => {
      let ch = Math.max(-0.12, Math.min(0.12, 0.04 * (nd[p.id] || 0)));
      const share = (own[p.id] || 0) / nTeams; ch += share > 0.25 ? 0.01 : share === 0 ? -0.01 : 0;
      (perf[d] || []).forEach(J => { if (J.st && J.st[p.id] && +J.st[p.id].m > 0) ch += Math.max(-0.15, Math.min(0.25, (pts(p, J) - 3) * 0.04)); else ch -= 0.03; });
      const m = map[p.id]; m.v = Math.max(200000, Math.round(m.v * (1 + ch) / 1000) * 1000); m.hist.push([d, m.v]);
    });
  }
  PLAYERS.forEach(p => { const h = map[p.id].hist; map[p.id].prev = h.length > 1 ? h[h.length - 2][1] : h[0][1]; });
  PRICE = { key, map }; return map;
}
const val = id => (prices()[id] || { v: 0 }).v;
const trendH = id => { const m = prices()[id]; if (!m) return ""; const d = m.v - m.prev; if (!d) return '<span class="trend" style="color:var(--muted)">= 0</span>';
  return `<span class="trend ${d > 0 ? "up" : "dn"}">${d > 0 ? "▲ +" : "▼ "}${eur(d)}</span>`; };

/* ---------- escritura ---------- */
let saving = Promise.resolve();
function saveTeam(t) { S.teams[S.uid] = t; render(); saving = saving.then(() => db.doc("teams/" + S.uid).set(t)).catch(e => toast(e && e.code === "not_granted" ? "No tienes permiso para jugar en esta página." : "No se ha podido guardar.")); }
function cloneMine() { const t = myTeam(); return { name: t.name || "", ops: (t.ops || []).slice(), lineups: JSON.parse(JSON.stringify(t.lineups || {})) }; }
function setLineup(t, l) { const J = curJ(); t.lineups[J.n] = l; }

function buy(pid) {
  const t = cloneMine(), sq = squadOf(t), p = PL(pid), price = val(pid);
  if (sq.includes(pid)) return;
  if (sq.length >= MAX_FICHAS) return toast("Tienes el máximo de " + MAX_FICHAS + " fichas.");
  if (money(t) < price) return toast("No te llega el saldo.");
  t.ops.push({ t: "buy", pid, price, at: Date.now() }); saveTeam(t); toast("Has fichado a " + p.nombre + " por " + eur(price) + " €");
}
function sell(pid) {
  const t = cloneMine(), p = PL(pid), price = val(pid), J = curJ(), l = lineupFor(t, J.n);
  if (locked(J) && l.s.includes(pid)) return toast("Está en tu alineación de una jornada en juego. Véndelo cuando se publiquen los puntos.");
  t.ops.push({ t: "sell", pid, price, at: Date.now() });
  if (l.s.includes(pid)) { const s = l.s.map(x => x === pid ? null : x); setLineup(t, { f: l.f, s, c: l.c === pid ? null : l.c }); }
  saveTeam(t); toast("Has vendido a " + p.nombre + " por " + eur(price) + " €");
}
function claimDaily() { const t = cloneMine(); if (dailyDone(t)) return; t.ops.push({ t: "daily", at: Date.now() }); saveTeam(t); toast("+" + eur(DAILY) + " €"); }
const dailyDone = t => (t.ops || []).some(o => o.t === "daily" && dayOf(o.at) === today());

const SUBS = { team: [["line", "Alineación"], ["squad", "Plantilla"], ["pts", "Puntos"]], market: [["mk", "Mercado"], ["ops", "Mis operaciones"], ["hist", "Histórico"]],

  if (S.view === "team" || S.view === "market") info.innerHTML = infoBar(t);

  main.innerHTML = (v === "team" && !t.name && !(t.ops || []).length ? welcome() : "") +
    (v === "team" ? (sub === "line" ? lineView(t) : sub === "squad" ? squadView(t) : ptsView(t)) :
     v === "market" ? (sub === "mk" ? marketView(t) : sub === "ops" ? opsView(t) : histView()) :
     v === "table" ? tableView() : v === "activity" ? activityView() : sub === "admin" ? adminView() : rulesView()) +
    (S.store === "local" ? '<div class="mode">Modo local: se guarda en este navegador y eres el administrador.</div>' : "");
  if (v === "market") bar.innerHTML = `<div class="mkbar"><div><span>Tu saldo</span><b>${eur(money(t))} <span class="coin">€</span></b></div></div><div class="mkpad"></div>`;
  renderSheet();
}
function infoBar(t) {
  const J = curJ(), sq = squadOf(t), tv = sq.reduce((s, id) => s + val(id), 0);
  return `<div class="app"><div class="info"><div><small>Fichas</small><b>${sq.length}/${MAX_FICHAS}</b></div>
    <div class="c"><small>Inicio jornada ${J.n}</small><b>${esc(fmtKick(J.inicio))}</b></div>
    <div class="r"><small>Valor equipo</small><b><span class="coin g">€</span> ${eur(tv)}</b></div></div></div>`;
}
function rewardBox(t) {
  if (dailyDone(t)) return "";
  return `<div class="reward"><p>¡Tienes tu recompensa diaria disponible!</p><div class="amt"><span class="coin">€</span> +${eur(DAILY)}</div><button class="ybtn" data-act="daily">Recoger recompensa</button></div>`;
}
function welcome() {
  return `<div class="box"><h3>Ponle nombre a tu equipo</h3><p>Empiezas con ${eur(START_MONEY)} €. Ficha en el Mercado y alinea 11 antes de cada partido del ${esc(EQUIPO)}.</p>
    <div class="row2"><input id="tname" maxlength="28" placeholder="p. ej. Los del 10" style="flex:1;min-width:0;background:#14151b;color:var(--fg);border:1px solid var(--line);padding:10px;font:inherit"><button class="abtn" data-act="tname">Guardar</button></div></div>`;
}

/* ---- Alineación ---- */
function lineView(t) {
  const J = curJ(), l = lineupFor(t, J.n), lk = locked(J), rows = FORMS[l.f], sq = new Set(squadOf(t));
  const lastJ = played().slice(-1)[0];
  let i = 1; const lines = [[["POR", 0]]].concat([["DEF", rows[0]], ["CEN", rows[1]], ["DEL", rows[2]]].map(([pos, n]) => { const a = []; for (let k = 0; k < n; k++) a.push([pos, i++]); return a; }));
  // Puntos de la última jornada publicada, si el jugador estaba en esa alineación
  const prevL = lastJ ? lineupFor(t, lastJ.n) : null;
  const slot = ([pos, idx]) => {
    const id = l.s[idx], p = id && sq.has(id) ? PL(id) : null;
    if (!p) return `<button class="slot empty" data-slot="${idx}" data-pos="${pos}" ${lk ? "disabled" : ""}><div class="face">${SIL}</div><div class="nm">${pos}</div></button>`;
    const pp = lastJ && J.n !== lastJ.n ? pts(p, lastJ) : null;
    return `<button class="slot full" data-slot="${idx}" data-pos="${pos}" ${lk ? "disabled" : ""}><div class="face">${SIL}<span class="num">${esc(p.dorsal)}</span>${l.c === id ? `<span class="cap">${CROWN}</span>` : ""}</div><div class="nm">${esc(short(p.nombre))}</div>${pp == null ? "" : `<span class="badge ${pp < 0 ? "neg" : ""}" title="Puntos en la J${lastJ.n}">${pp}</span>`}</button>`;
  };
  const opts = Object.keys(FORMS).map(f => `<option value="${f}" ${f === l.f ? "selected" : ""}>${f.replace(/-/g, "·")}</option>`).join("");
  const filled = l.s.filter(x => x && sq.has(x)).length;
  return rewardBox(t) +
    (lk ? `<div class="lockmsg">La jornada ${J.n} ya ha empezado. La alineación está cerrada hasta que se publiquen los puntos.</div>` : "") +
    `<div class="row2"><select class="form" id="form" ${lk ? "disabled" : ""} aria-label="Formación">${opts}</select>
      <button class="capbtn ${S.capMode ? "on" : ""}" data-act="cap" ${lk ? "disabled" : ""}>${CROWN} ${S.capMode ? "Toca un jugador" : "Asignar capitán"}</button></div>
    <div class="note">${filled}/11 alineados${filled < 11 ? " · Con menos de 11 no puntúas en la jornada." : ""}${J.rival ? " · Jornada " + J.n + ": " + esc(vsTxt(J)) : ""}</div>
    <div class="pitch">${lines.slice().reverse().map(L => `<div class="line">${L.map(slot).join("")}</div>`).join("")}</div>`;
}
const short = n => { const p = n.split(" "); return p.length > 1 ? p[0][0] + ". " + p.slice(1).join(" ") : n; };
const vsTxt = J => J.local ? "Almazora C vs " + (J.rival || "?") : (J.rival || "?") + " vs Almazora C";

/* ---- Plantilla ---- */
function pcard(p, t, mode) {
  const m = prices()[p.id], pl = played(), last5 = pl.slice(-5);
  const pf = pl.reduce((s, J) => s + pts(p, J), 0), apps = pl.filter(J => J.st && J.st[p.id] && +J.st[p.id].m > 0).length;
  const media = apps ? (pf / apps).toFixed(2).replace(".", ",") : "0";
  const boxes = Array.from({ length: 5 }, (_, k) => { const J = last5[k - (5 - last5.length)]; if (!J) return '<i class="x">–</i>';
    const played_ = J.st && J.st[p.id] && +J.st[p.id].m > 0, v = pts(p, J); return `<i class="${!played_ ? "x" : v > 2 ? "p" : v > 0 ? "z" : "n"}">${played_ ? v : "–"}</i>`; }).join("");
  const inL = mode === "squad" && lineupFor(t, curJ().n).s.includes(p.id);
  const btn = mode === "squad" ? `<button class="abtn" data-sell="${p.id}">Vender</button>` :
    `<button class="abtn" data-buy="${p.id}" ${squadOf(t).includes(p.id) ? "disabled" : ""}>${squadOf(t).includes(p.id) ? "Fichado" : "Fichar"}</button>`;
  return `<div class="pcard"><div class="ph">${SIL}<span class="num">${esc(p.dorsal)}</span>${inL ? `<span class="inxi">${CHK}</span>` : ""}</div><div class="bd">
    <div class="tt"><span class="pos ${p.pos}">${p.pos}</span><b>${esc(p.nombre)}</b></div><div class="big">PFSY<b>${pf}</b></div>
    <div class="ln"><span class="ck">${CHK}</span>Alineable</div><div class="rt">MEDIA: <b>${media}</b></div>
    <div class="ln"><span class="coin">€</span>${eur(m.v)}</div><div class="rt">${trendH(p.id)}</div>
    <div class="boxes">${boxes}</div><div>${btn}</div></div></div>`;
}
function squadView(t) {
  const sq = squadOf(t).map(PL).sort((a, b) => "PORDEFCENDEL".indexOf(a.pos) - "PORDEFCENDEL".indexOf(b.pos));
  return rewardBox(t) + (sq.length ? sq.map(p => pcard(p, t, "squad")).join("") : `<div class="empty">Aún no tienes jugadores. Ve al <button class="gbtn" data-go="market">Mercado</button></div>`) +
    `<div class="note">PFSY: puntos de la temporada según las actas. Cuadros: puntos de las 5 últimas jornadas.</div>`;
}

/* ---- Puntos ---- */
function ptsView(t) {
  const pl = fplayed().slice().reverse(); if (!pl.length) return `<div class="empty">El fantasy empieza a puntuar en la jornada ${FIRST_J}. Aquí verás tus puntos de cada jornada.</div>`;
  return pl.map(J => { const r = teamJPts(t, J);
    const rows = r.l.s.filter(Boolean).map(id => { const p = PL(id); if (!p) return ""; const v = pts(p, J) * (id === r.l.c ? 2 : 1);
      return `<tr><td><span class="pos ${p.pos}">${p.pos}</span> ${esc(p.nombre)}${id === r.l.c ? " (C ×2)" : ""}</td><td>${v}</td></tr>`; }).join("");
    return `<div class="box"><h3>Jornada ${J.n} · ${esc(vsTxt(J))} ${+J.local ? J.gf + "-" + J.gc : J.gc + "-" + J.gf}</h3>
      ${r.total == null ? `<p>No has puntuado: alineación incompleta.</p>` : `<p>Total: <b>${r.total} puntos</b> · Premio: ${eur(Math.max(0, r.total) * PER_POINT)} €</p><table>${rows}</table>`}</div>`; }).join("");
}

/* ---- Mercado ---- */
function marketView(t) {
  const sq = new Set(squadOf(t)), pos = S.mpos || "ALL";
  const list = PLAYERS.filter(p => pos === "ALL" || p.pos === pos).sort((a, b) => (sq.has(a.id) - sq.has(b.id)) || val(b.id) - val(a.id));
  return rewardBox(t) + `<div class="chips">${[["ALL", "Todos"], ["POR", "Porteros"], ["DEF", "Defensas"], ["CEN", "Medios"], ["DEL", "Delanteros"]].map(([k, l]) => `<button data-mpos="${k}" class="${pos === k ? "on" : ""}">${l}</button>`).join("")}</div>` +
    `<div class="note">Los precios cambian cada día a las 00:00 según fichajes, ventas y puntos de la última jornada.</div>` + list.map(p => pcard(p, t, "market")).join("");
}
function opsView(t) {
  const ops = (t.ops || []).filter(o => o.t !== "daily").slice().reverse();
  if (!ops.length) return '<div class="empty">Aún no has hecho operaciones.</div>';
  return ops.map(o => { const p = PL(o.pid); return `<div class="act"><div class="h"><b>${o.t === "buy" ? "Fichaje" : "Venta"}</b><span>${fmtD(o.at)}</span></div><p>${p ? esc(p.nombre) : "Jugador"} por ${eur(o.price)} €</p></div>`; }).join("");
}
function histView() {
  const map = prices();
  return `<div class="note">Precio de cada jugador en los últimos 10 días.</div><div class="tbl">` + PLAYERS.slice().sort((a, b) => map[b.id].v - map[a.id].v).map(p => {
    const h = map[p.id].hist.slice(-10), mx = Math.max(...h.map(x => x[1])), mn = Math.min(...h.map(x => x[1]));
    const bars = h.map((x, i) => `<i class="${i && x[1] > h[i - 1][1] ? "u" : i && x[1] < h[i - 1][1] ? "d" : ""}" style="height:${mx === mn ? 50 : 20 + 80 * (x[1] - mn) / (mx - mn)}%"></i>`).join("");
    return `<div class="tr" style="grid-template-columns:minmax(0,1fr) 70px auto"><div class="t"><b><span class="pos ${p.pos}">${p.pos}</span> ${esc(p.nombre)}</b><small>${trendH(p.id)}</small></div><div class="spark">${bars}</div><div class="p" style="font-size:15px">${eur(map[p.id].v)}</div></div>`; }).join("") + "</div>";
}

/* ---- Clasificación ---- */
const nameOf = uid => (S.names[uid] && S.names[uid].name) || "Jugador";
function tableView() {
  const pl = fplayed(), sub = S.sub.table, jn = S.tj || (pl.length ? pl[pl.length - 1].n : null);
  const rows = Object.entries(S.teams).map(([uid, t]) => { const tt = teamTotals(t);
    return { uid, t, total: sub === "gen" ? tt.total : (tt.per[jn] == null ? null : tt.per[jn]), value: squadOf(t).reduce((s, id) => s + val(id), 0) }; })
    .sort((a, b) => (b.total ?? -999) - (a.total ?? -999) || b.value - a.value);
  if (!rows.length) return '<div class="empty">Todavía no hay equipos. Sé el primero.</div>';
  const chips = sub === "jor" ? (pl.length ? `<div class="chips">${pl.map(J => `<button data-tj="${J.n}" class="${J.n === jn ? "on" : ""}">J${J.n}</button>`).join("")}</div>` : '<div class="empty">Aún no hay jornadas jugadas.</div>') : "";
  if (sub === "jor" && !pl.length) return chips;
  return chips + `<div class="tbl">${rows.map((r, i) => `<div class="tr ${r.uid === S.uid ? "me" : ""}"><div class="n">${i + 1}</div><div class="t"><b>${esc(r.t.name || "Sin nombre")}</b><small>${esc(nameOf(r.uid))} · ${eur(r.value)} €</small></div>
    <div class="p">${r.total == null ? "–" : r.total}<small>puntos</small></div></div>`).join("")}</div>`;
}

/* ---- Actividad ---- */
function activityView() {
  const items = [];
  Object.entries(S.teams).forEach(([uid, t]) => {
    const nm = t.name || nameOf(uid);
    (t.ops || []).forEach(o => { const p = PL(o.pid); if (o.t === "buy" || o.t === "sell")
      items.push({ at: o.at, h: "Operación de mercado", p: `${nm} ha ${o.t === "buy" ? "comprado" : "vendido"} al jugador ${p ? p.nombre : "?"} por ${eur(o.price)}€` }); });
    fplayed().forEach(J => { if (!J.publicada) return; const r = teamJPts(t, J);
      items.push(r.total == null ? { at: J.publicada, h: "No puntuación", p: `En la jornada ${J.n}, ${nm} no ha puntuado debido a alineación incompleta.` }
        : { at: J.publicada, h: "Recompensa", p: `En la jornada ${J.n}, ${nm} ha ganado ${eur(Math.max(0, r.total) * PER_POINT)}€ (${r.total} puntos)` }); });
  });
  played().forEach(J => J.publicada && items.push({ at: J.publicada + 1, h: "Jornada " + J.n, p: `${vsTxt(J)}: ${J.local ? J.gf + "-" + J.gc : J.gc + "-" + J.gf}. Puntos publicados.` }));
  items.sort((a, b) => b.at - a.at);
  return items.length ? items.slice(0, 120).map(x => `<div class="act"><div class="h"><b>${esc(x.h)}</b><span>${fmtD(x.at)}</span></div><p>${esc(x.p)}</p></div>`).join("") : '<div class="empty">Sin actividad todavía.</div>';
}

/* ---- Reglas ---- */
function rulesView() {
  return `<div class="box"><h3>Cómo se juega</h3><p>Empiezas con ${eur(START_MONEY)} €. Ficha hasta ${MAX_FICHAS} jugadores del ${esc(EQUIPO)} y alinea 11 antes de que empiece cada partido. Si alineas menos de 11, no puntúas esa jornada. El capitán puntúa doble.</p>
    <p>Cada punto que haga tu once te da ${eur(PER_POINT)} €. Recompensa diaria: ${eur(DAILY)} €. Los jugadores no son exclusivos: varios pueden tener al mismo.</p></div>
    <div class="box"><h3>Puntos (según el acta)</h3><table>
    <tr><td>Juega menos de 60' / 60' o más</td><td>+1 / +2</td></tr>
    <tr><td>Gol de portero / defensa / medio / delantero</td><td>+10 / +6 / +5 / +4</td></tr>
    <tr><td>Portería a cero (60'+) portero / defensa / medio</td><td>+4 / +3 / +1</td></tr>
    <tr><td>Por cada 2 goles encajados (portero y defensa, 60'+)</td><td>−1</td></tr>
    <tr><td>Victoria / empate (si juega)</td><td>+2 / +1</td></tr>
    <tr><td>Amarilla / doble amarilla o roja</td><td>−1 / −3</td></tr>
    <tr><td>Gol en propia puerta</td><td>−2</td></tr></table><p class="note">J1–J8 ya están puntuadas con las actas de la FFCV. Desde la J9, el administrador mete cada acta.</p></div>
    <div class="box"><h3>Precios</h3><p>Cambian cada día a las 00:00:</p><ul>
    <li>Oferta y demanda: +4 % por cada fichaje neto del día anterior (fichajes − ventas), tope ±12 %.</li>
    <li>Popularidad: +1 % si lo tiene más de 1 de cada 4 equipos; −1 % si no lo tiene nadie.</li>
    <li>Rendimiento: el día después de publicar una jornada, (puntos − 3) × 4 % (entre −15 % y +25 %). Si no juega, −3 %.</li></ul>
    <p>Vendes al precio del día.</p></div>` + (S.store === "api" ? `<div class="box"><p>Has entrado como <b>${esc(S.uid)}</b>.</p><button class="gbtn" data-act="logout">Cerrar sesión</button></div>` : "");
}

/* ---- Admin: meter el acta ---- */
function adminView() {
  if (!S.admin) return '<div class="empty">Solo el administrador mete las actas.</div>';
  const J = S.adminJ || (() => { const c = curJ(); return c.virtual ? { n: c.n, rival: c.rival || "", local: c.local !== false, inicio: c.inicio || "", gf: 0, gc: 0, st: {} } : JSON.parse(JSON.stringify(c)); })();
  S.adminJ = J;
  const list = Js().filter(j => j.n > 8 || S.jornadas[j.n]).map(j => `<button data-aj="${j.n}" class="${j.n === J.n ? "on" : ""}">J${j.n}${j.jugada ? " ✓" : ""}</button>`).join("");
  const rows = PLAYERS.map(p => { const s = J.st[p.id] || {}; return `<div class="nm"><span class="pos ${p.pos}">${p.pos}</span> ${esc(p.nombre)}</div>
    <input type="number" min="0" max="120" inputmode="numeric" data-st="${p.id}" data-k="m" value="${s.m || ""}" placeholder="0">
    <input type="number" min="0" max="9" inputmode="numeric" data-st="${p.id}" data-k="g" value="${s.g || ""}" placeholder="0">
    <select data-st="${p.id}" data-k="y">${[0, 1, 2].map(v => `<option ${+s.y === v ? "selected" : ""}>${v}</option>`).join("")}</select>
    <input type="checkbox" data-st="${p.id}" data-k="r" ${s.r ? "checked" : ""} style="width:20px;height:20px;justify-self:center">`; }).join("");
  return `<div class="chips">${list}<button data-aj="new">+ Nueva</button></div>
  <div class="box"><h3>Jornada ${J.n}${J.jugada ? " · puntos publicados" : ""}</h3>
    <div class="grid2"><div class="fld"><label>Rival</label><input data-j="rival" value="${esc(J.rival || "")}" placeholder="C.F. Atlético Tales"></div>
    <div class="fld"><label>Campo</label><select data-j="local"><option value="1" ${J.local ? "selected" : ""}>En casa</option><option value="0" ${!J.local ? "selected" : ""}>Fuera</option></select></div>
    <div class="fld"><label>Inicio (cierra alineaciones)</label><input type="datetime-local" data-j="inicio" value="${esc(J.inicio || "")}"></div>
    <div class="grid2"><div class="fld"><label>Goles Almazora C</label><input type="number" min="0" data-j="gf" value="${+J.gf || 0}"></div><div class="fld"><label>Goles rival</label><input type="number" min="0" data-j="gc" value="${+J.gc || 0}"></div></div></div>
    <p class="note">Del acta: minutos jugados (titular que acaba = 90, cambio = minuto del cambio), goles, amarillas (2 = doble amarilla) y roja directa. No convocado o sin jugar: déjalo vacío.</p>
    <div class="acta"><span class="h">Jugador</span><span class="h">Min</span><span class="h">Gol</span><span class="h">Am.</span><span class="h">Roja</span>${rows}</div>
    <div class="row2" style="margin-top:14px"><button class="gbtn" data-act="jsave">Guardar</button>
      ${J.jugada ? `<button class="gbtn" data-act="jreopen">Quitar publicación</button>` : `<button class="abtn" data-act="jpub">Publicar puntos</button>`}</div></div>
  <div class="box"><h3>Añadir jugador a la plantilla</h3><div class="grid2"><div class="fld"><label>Nombre</label><input id="nxN"></div><div class="fld"><label>Dorsal</label><input id="nxD" type="number"></div>
    <div class="fld"><label>Posición</label><select id="nxP"><option>POR</option><option>DEF</option><option selected>CEN</option><option>DEL</option></select></div><div class="fld"><label>Precio inicial</label><input id="nxV" type="number" value="800000"></div></div>
    <button class="gbtn" data-act="addpl">Añadir</button></div>`;
}
function readAdminForm() {
  const J = S.adminJ; document.querySelectorAll("[data-j]").forEach(el => { const k = el.dataset.j; J[k] = k === "local" ? el.value === "1" : k === "gf" || k === "gc" ? +el.value || 0 : el.value; });
  const st = {}; document.querySelectorAll("[data-st]").forEach(el => { const id = el.dataset.st, k = el.dataset.k; st[id] = st[id] || {};
    st[id][k] = k === "r" ? el.checked : +el.value || 0; });
  Object.keys(st).forEach(id => { const s = st[id]; if (!s.m && !s.g && !s.y && !s.r) delete st[id]; }); J.st = st; return J;
}
async function saveJ(J) { try { await db.doc("jornadas/j" + J.n).set(J); toast("Guardado"); } catch (e) { toast(e && e.code === "not_granted" ? "Solo el administrador puede guardar actas." : "No se ha podido guardar."); } }

/* ---- hoja de selección de jugador ---- */
function renderSheet() {
  const el = document.getElementById("sheet"); if (!S.sheet) { el.innerHTML = ""; return; }
  const t = myTeam(), J = curJ(), l = lineupFor(t, J.n), { idx, pos } = S.sheet, cur = l.s[idx];
  const opts = squadOf(t).map(PL).filter(p => p.pos === pos && (!l.s.includes(p.id) || p.id === cur));
  el.innerHTML = `<div class="sheet" data-close="1"><div class="in"><h3>Elige ${POSN[pos].toLowerCase()}</h3>
    ${opts.length ? opts.map(p => `<button class="opt" data-pick="${p.id}"><b>${esc(p.nombre)}${p.id === cur ? " ✓" : ""}</b><span>${eur(val(p.id))} €</span></button>`).join("") : `<p class="note">No tienes ${POSN[pos].toLowerCase()}s libres. Ficha en el Mercado.</p>`}
    ${cur ? `<button class="opt" data-pick=""><b>Quitar de la alineación</b></button>` : ""}
    <button class="gbtn" data-close="1" style="width:100%;margin-top:6px">Cerrar</button></div></div>`;
}

/* ---------- eventos ---------- */
let toastT; function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
document.addEventListener("click", e => {
  const b = e.target.closest("button,[data-close]"); if (!b) return; const d = b.dataset;
  if (d.close && e.target === b) { S.sheet = null; return render(); }
  if (d.authTab) { S.authTab = d.authTab; S.authMsg = ""; return render(); }
  if (d.act === "logout") { api("logout").catch(() => {}); try { localStorage.removeItem(TK); } catch (e) {} return location.reload(); }
  if (d.go) { S.view = d.go; S.capMode = false; scrollTo(0, 0); return render(); }
  if (d.sub) { S.sub[S.view] = d.sub; scrollTo(0, 0); return render(); }
  if (d.mpos) { S.mpos = d.mpos; return render(); }
  if (d.tj) { S.tj = +d.tj; return render(); }
  if (d.buy) return buy(d.buy);
  if (d.sell) return sell(d.sell);
  if (d.slot != null && d.slot !== undefined && b.classList.contains("slot")) {
    const t = myTeam(), J = curJ(), l = lineupFor(t, J.n), id = l.s[+d.slot];
    if (S.capMode) { if (!id) return; const nt = cloneMine(); setLineup(nt, { f: l.f, s: l.s, c: id }); S.capMode = false; saveTeam(nt); return toast("Capitán: " + PL(id).nombre); }
    S.sheet = { idx: +d.slot, pos: d.pos }; return render();
  }
  if (d.pick != null) { const t = cloneMine(), J = curJ(), l = lineupFor(t, J.n), s = l.s.slice(); s[S.sheet.idx] = d.pick || null;
    setLineup(t, { f: l.f, s, c: s.includes(l.c) ? l.c : null }); S.sheet = null; return saveTeam(t); }
  const a = d.act;
  if (a === "daily") return claimDaily();
  if (a === "cap") { S.capMode = !S.capMode; return render(); }
  if (a === "tname") { const v = (document.getElementById("tname").value || "").trim().slice(0, 28); if (!v) return; const t = cloneMine(); t.name = v; return saveTeam(t); }
  if (d.aj) { if (d.aj === "new") { const mx = Math.max(8, ...Js().map(j => j.n)), c = CAL(mx + 1) || {}; S.adminJ = { n: mx + 1, rival: c.rival || "", local: c.local !== false, inicio: c.inicio || "", gf: 0, gc: 0, st: {} }; }
    else S.adminJ = JSON.parse(JSON.stringify(Js().find(j => j.n === +d.aj))); return render(); }
  if (a === "jsave") return saveJ(readAdminForm());
  if (a === "jpub") { const J = readAdminForm(); J.jugada = true; J.publicada = Date.now(); return saveJ(J); }
  if (a === "jreopen") { const J = readAdminForm(); J.jugada = false; delete J.publicada; return saveJ(J); }
  if (a === "addpl") { const n = (document.getElementById("nxN").value || "").trim(); if (!n) return;
    const extra = PLAYERS.filter(p => !PLANTILLA.some(x => x[0] === p.id)).map(p => ({ id: p.id, nombre: p.nombre, pos: p.pos, dorsal: p.dorsal, valor: p.v0 }));
    extra.push({ id: "x" + Date.now().toString(36), nombre: n, pos: document.getElementById("nxP").value, dorsal: +document.getElementById("nxD").value || "", valor: +document.getElementById("nxV").value || 800000 });
    db.doc("liga/plantilla").set({ extra }).then(() => toast("Añadido"), () => toast("No se ha podido añadir.")); }
});
document.addEventListener("submit", e => { if (e.target.id === "auform") { e.preventDefault(); auth(S.authTab === "up" ? "up" : "in"); } });
document.addEventListener("change", e => {
  if (e.target.id === "form") { const f = e.target.value; const t = cloneMine(), J = curJ(), l = lineupFor(t, J.n), rows = FORMS[f];
    // recoloca a los jugadores por posición en la nueva formación
    const byPos = { POR: [], DEF: [], CEN: [], DEL: [] }; l.s.forEach(id => { const p = id && PL(id); if (p) byPos[p.pos].push(id); });
    const s = [byPos.POR[0] || null]; [["DEF", rows[0]], ["CEN", rows[1]], ["DEL", rows[2]]].forEach(([pos, n]) => { for (let k = 0; k < n; k++) s.push(byPos[pos][k] || null); });
    setLineup(t, { f, s, c: s.includes(l.c) ? l.c : null }); saveTeam(t); }
});
setInterval(() => { if (S.store !== "loading" && !document.querySelector("input:focus,select:focus")) render(); }, 60000);
render(); connect();
</script>
